function computeStats() {

  members().forEach(p => { S2[p.k] = { mpS: { w: 0, h: 0, l: 0 }, mpF: { w: 0, h: 0, l: 0 }, pts: 0, n: 0, stab18: [], stab9: [], yes: 0, conv: 0, hist: [], mp: [], put: { putts: 0, holes: 0, rounds: 0, udOk: 0, udTry: 0, sOk: 0, sTry: 0, girOk: 0, girHoles: 0 },
      pb: { pars: 0, birdies: 0, rounds: 0 },

  const sorted = S.events.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  sorted.forEach(ev => {
    if (ev.cancel) return;   // un evenement annule ne compte nulle part
    const memberKeys = (S.team && S.team.memberKeys) || [];
    Object.keys(S2).forEach(k => {
      const inv = ev.free ? (ev.invited || []).includes(k) : memberKeys.includes(k);
      if (inv) { S2[k].conv++; if (ev.r && ev.r[k] === 'yes') S2[k].yes++; }
    });
    if (isMPt(ev.type)) {
      Object.entries(ev.extra || {}).forEach(([k, e]) => {
        const B = S2[k] && S2[k].pb; if (!B || !e) return;
        if (!has(e.pars) && !has(e.birdies)) return;
        B.pars += Number(e.pars || 0); B.birdies += Number(e.birdies || 0); B.rounds++;
      });
      const parties = ev.parties || (ev.sideA ? [{ a: ev.sideA, b: ev.sideB }] : []);
      parties.forEach(pt => {
        if (!pt.outcome) return;
        const four = pt.four !== undefined ? pt.four : ev.format === 'foursome';
        const inv = pt.outcome === 'win' ? 'loss' : pt.outcome === 'loss' ? 'win' : 'half';
        const sides = [{ ks: pt.a || [], res: pt.outcome, opp: names(pt.b) }, { ks: Array.isArray(pt.b) ? pt.b : [], res: inv, opp: names(pt.a) }];
        sides.forEach(sd => sd.ks.forEach(k => {
          const x = S2[k]; if (!x) return;
          const rec = four ? x.mpF : x.mpS;
          rec[sd.res === 'win' ? 'w' : sd.res === 'loss' ? 'l' : 'h']++;
          x.pts += sd.res === 'win' ? 1 : sd.res === 'half' ? 0.5 : 0; x.n++;
          const partner = sd.ks.filter(m => m !== k).map(nameOf).join(' & ');
          x.mp.push({ date: ev.date, title: ev.title, four, holes: ev.holes || 18, opp: sd.opp, partner, res: sd.res, margin: pt.margin || '' });
          x.hist.push({ date: ev.date, title: ev.title, tag: (four ? 'Foursome' : 'Simple') + ' · vs ' + sd.opp, label: sd.res === 'win' ? 'Victoire ' + (pt.margin || '') : sd.res === 'loss' ? 'Défaite ' + (pt.margin || '') : 'Partagé', cls: sd.res });
        }));
      });
    }
    if (isSkills(ev.type)) {
      Object.entries(ev.scores || {}).forEach(([k, v]) => {
        const K2 = S2[k] && S2[k].sk; if (!K2 || !v || typeof v !== 'object') return;
        if (!has(v.a) && !has(v.p)) return;
        const a = Number(v.a || 0), pp = Number(v.p || 0), t = a + pp;
        K2.a += a; K2.p += pp; K2.n++; if (t > K2.best) K2.best = t;
        S2[k].hist.push({ date: ev.date, title: ev.title, tag: 'Approche et putting', label: t + ' pts (' + a + ' + ' + pp + ')', cls: '' });
      });
    }
    if (isCourse(ev.type)) {
      const h = holesOf(ev);
      Object.entries(ev.scores || {}).forEach(([k, v]) => {
        if (!has(v) || isNaN(Number(v)) || !S2[k]) return;
        S2[k][h === 18 ? 'stab18' : 'stab9'].push(Number(v)); S2[k].n++;
        S2[k].hist.push({ date: ev.date, title: ev.title, tag: 'Stableford · ' + h + ' trous', label: v + ' pts', cls: '' });
      });
      Object.entries(ev.extra || {}).forEach(([k, e]) => {
        const P = S2[k] && S2[k].put; if (!P || !e) return;
        if (has(e.putts)) { P.putts += Number(e.putts); P.holes += h; P.rounds++; }
        if (has(e.gir)) { P.girOk += Number(e.gir); P.girHoles += h; }
        P.udOk += Number(e.udOk || 0); P.udTry += Number(e.udTry || 0); P.sOk += Number(e.sOk || 0); P.sTry += Number(e.sTry || 0);
      });
    }

}

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; softRender(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('App installée sur ton écran d’accueil'); });
function vInstall() {
  if (isStandalone()) return '';
  const snooze = Number(lsGet('ic_install_snooze') || 0);
  if (snooze > Date.now()) return '';
  const x = `<button class="ibtn" data-a="installLater" aria-label="Masquer">✕</button>`;
  const box = inner => `<div style="display:flex;align-items:center;gap:8px;background:var(--gl);border-radius:12px;padding:6px 6px 6px 12px">${inner}${x}</div>`;
  if (installEvt) return box(`<div class="grow" style="font-size:13px;font-weight:700;color:var(--gd)">Installer l’app sur ce téléphone</div><button class="btn primary" style="height:34px;font-size:13px;padding:0 12px" data-a="installNow">Installer</button>`);
  if (isIOS()) return box(`<div style="flex:1;min-width:0;font-size:12px;line-height:1.4;color:var(--gd)"><b>Installer l’app :</b> touche <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-label="Partager" role="img" style="vertical-align:-2px"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> Partager puis « Sur l’écran d’accueil »</div>`);
  return '';
}

/* ---------- render infrastructure ---------- */
const root = document.getElementById('root');
let lastViewKey = '';
function isTyping() { const a = document.activeElement; return a && root.contains(a) && ['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName); }
function softRender() { if (isTyping()) { S.pending = true; return; } render(); }
root.addEventListener('focusout', () => setTimeout(() => { if (S.pending && !isTyping()) { S.pending = false; render(); } }, 50));

function render() {
  const sc = document.getElementById('scroll');
  const key = [U.tab, U.view, U.sel, U.selPlayer, U.statTab, U.agFilter, S.teamId].join('|');
  const keep = sc && key === lastViewKey ? sc.scrollTop : null;
  root.innerHTML = view();
  applyDecor();
  updateFx();
  document.title = S.team ? (S.team.title || ('Interclub ' + (S.team.name || ''))) : 'Interclub';
  lastViewKey = key;
  const sc2 = document.getElementById('scroll');
  // Ecrans ordinaires : en fin de zone defilante. Connexion et chargement :
  // en bas du bloc .auth, qui n'a pas de zone defilante.
  const host = sc2 || root.querySelector('.auth');
  if (host) host.insertAdjacentHTML('beforeend', LEGAL);
  if (sc2 && keep !== null) sc2.scrollTop = keep;
  if (U.todayScroll && U.tab === 'agenda' && U.view === 'list') {
    const mark = document.getElementById('today-mark');
    if (sc2 && mark) { sc2.scrollTop = mark.offsetTop - sc2.offsetTop - 4; U.todayScroll = false; }
  }
}

/* Mention legale, ajoutee en bas de chaque ecran par render(). */
const LEGAL = '<div class="legal">© 2026 Francis Berlier — Interclub · Tous droits réservés · Usage réservé au RWGC</div>';
(function () {
  const st = document.createElement('style');
  st.textContent = '.legal{padding:16px 12px 6px;text-align:center;font-size:10px;line-height:1.5;' +
    'letter-spacing:.2px;color:var(--mut);opacity:.7}';
  document.head.appendChild(st);
})();

function view() {
  if (!configured) return `<div class="auth"><div class="logo">Interclub</div><div class="card"><div class="t15">Configuration manquante</div><div class="small">Colle la configuration Firebase dans le fichier index.html (bloc CONFIGURATION), puis recharge la page.</div></div></div>`;
  if (S.loading) return `<div class="auth"><div class="logo">Interclub</div><div class="small">Chargement…</div></div>`;
  if (!S.user) return vAuth();
  let body = '';
  if (!S.teams.length && !isAdmin()) body = vNoTeam();
  else if (U.tab === 'admin') body = vAdmin();
  else if (!S.team) body = `<div class="top"><h1>Interclub</h1><div class="small">${S.teams.length ? 'Chargement de l’équipe…' : 'Aucune équipe. Crée-en une dans l’onglet Admin.'}</div></div>`;
  else if (U.view === 'detail' && getEv(U.sel)) body = vDetail(getEv(U.sel));
  else if (U.view === 'results' && getEv(U.sel)) body = vResults(getEv(U.sel));
  else if (U.view === 'add') body = vAdd();
  else if (U.view === 'player' && U.selPlayer) body = vFiche(U.selPlayer, true);
  else if (U.view === 'matches' && U.selPlayer) body = vMatches(U.selPlayer);
  else if (U.tab === 'squad') body = vSquad();
  else if (U.tab === 'stats') body = capView() ? vStats() : vFiche(me(), false);
  else body = vAgenda();
  return body + vNav() + (U.toast ? `<div class="toast" role="status">${esc(U.toast)}</div>` : '');
}

/* ---------- auth views ---------- */
function vAuth() {
  const m = U.authMode;
  return `<div class="auth">
  <div class="logo">Interclub</div>
  <div class="sub">${m === 'signup' ? 'Créer ton compte' : m === 'reset' ? 'Mot de passe oublié' : 'Connexion'}</div>
  ${m === 'signup' ? `<label class="f">Prénom et nom<input class="in" data-f="aName" autocomplete="name" value="${esc(U.aName)}"></label>
  <label class="f">N° de GSM<input class="in" type="tel" data-f="aPhone" autocomplete="tel" inputmode="tel" placeholder="ex. 0475 12 34 56" value="${esc(U.aPhone)}"></label>
  <div class="small">Visible uniquement par ton capitaine.</div>` : ''}
  <label class="f">E-mail<input class="in" type="email" data-f="aEmail" autocomplete="email" inputmode="email" value="${esc(U.aEmail)}"></label>
  ${m !== 'reset' ? `<label class="f">Mot de passe<input class="in" type="password" data-f="aPwd" autocomplete="${m === 'signup' ? 'new-password' : 'current-password'}" value="${esc(U.aPwd)}"></label>` : ''}
  ${m === 'signup' ? `<div class="small">${PWD_RULE}</div>` : ''}
  ${U.aErr ? `<div class="err">${esc(U.aErr)}</div>` : ''}${U.aOk ? `<div class="ok">${esc(U.aOk)}</div>` : ''}
  <button class="btn primary" data-a="authGo">${m === 'signup' ? 'Créer le compte' : m === 'reset' ? 'Envoyer le lien' : 'Se connecter'}</button>
  ${m === 'reset'
    ? `<div class="small">Indique l’e-mail avec lequel tu te connectes. Tu recevras un lien pour choisir un nouveau mot de passe. Pense à regarder tes courriers indésirables.</div>
       <button class="link" data-a="authMode" data-v="login">Retour à la connexion</button>`
    : `<button class="link" data-a="authMode" data-v="reset">Mot de passe oublié ?</button>
       <div class="small">Tu recevras un lien par e-mail. Si tu ne reçois rien, demande à ton capitaine.</div>`}
  <div class="small">Pas encore d’accès ? Ton capitaine crée ton compte et t’envoie ton identifiant et ton mot de passe.</div>
  <div class="small center">${VERSION}</div>
  </div>`;
}
function vNoTeam() {
  return `<div class="auth"><div class="logo">Interclub</div>
  <div class="card"><div class="t15">Bienvenue ${esc(S.user.displayName || '')}</div>
  <div class="small">Ton compte est prêt. Une demande d’accès a été envoyée aux capitaines : dès que le tien la valide, tu verras ton équipe ici automatiquement.</div>
  <button class="btn" data-a="resendRequest">Renvoyer ma demande</button></div>
  <button class="link" data-a="logout">Se déconnecter</button></div>`;
}

function applyDecor() {
  const k = S.user && S.team ? activeTheme() : 'none';
  const d = DECOR[k];
  root.classList.toggle('themed', !!d);
  root.style.backgroundColor = d ? d.bg : '';

const AUTO_THEMES = [['11-20', '12-06', 'stnicolas'], ['12-07', '12-27', 'noel'], ['12-28', '01-10', 'nouvelan'], ['01-11', '03-19', 'hiver'], ['03-20', '05-31', 'printemps']];
/* Paques est une fete mobile : on la calcule (algorithme de Meeus) au lieu
   de la ranger dans AUTO_THEMES, qui ne connait que des dates fixes. */
function easterDate(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100;
  const d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);

  return new Date(y, Math.floor(n / 31) - 1, (n % 31) + 1);

function inEaster(d) {

/* Evenements a venir, non annules, ou je suis convoque sans avoir repondu.

function pending() {
  const mk = me(), today = new Date().toISOString().slice(0, 10);
  const pool = (S.team && S.team.memberKeys) || [];
  const seen = new Set();
  return (S.events || []).filter(e => {
    if (e.cancel || e.date < today) return false;
    const invited = e.free ? (e.invited || []) : pool;
    if (!invited.includes(mk)) return false;
    if ((e.r || {})[mk]) return false;          // deja repondu
    if (e.group) {
      // un groupe de creneaux = une seule decision a prendre
      if (groupOf(e).some(x => (x.r || {})[mk] === 'yes')) return false;
      if (seen.has(e.group)) return false;
      seen.add(e.group);
    }
    return !isFull(e);
  }).length;
}

  return `<div class="top"><div><button class="back" data-a="backList">${ICON.back}Agenda</button></div></div>
  <div class="scroll" id="scroll" style="gap:18px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="badge" style="background:${ev.cancel ? '#9AA3AE' : t.color};color:${ev.cancel ? '#fff' : ink(t.color)}">${ev.cancel ? 'Annulé · ' : ''}${esc(typeText(ev))}</span>
    <h2${ev.cancel ? ' class="strike"' : ''}>${ev.open && !ev.cancel ? CALLMK + ' ' : ''}${ev.imp && !ev.cancel ? STAR + ' ' : ''}${esc(ev.title)}</h2>
    <div class="sub" style="font-weight:500">${longDate(ev.date)}${ev.time ? ' · ' + esc(timeText(ev)) : ''}</div>
    ${ev.place ? `<div class="sub" style="font-weight:500">${esc(ev.place)}</div>` : ''}
    ${ev.free ? `<div style="font-size:13px;font-weight:700;color:var(--or)">${ev.open ? 'Appel à tous' : 'Partie libre'} · organisé${ev.open ? '' : 'e'} par ${esc(nameOf(ev.org))}</div>` : ''}
    ${ev.open && ev.org === mk ? '<div class="small">Les joueurs intéressés répondent « Je participe ». Compose ensuite les parties dans Résultats.</div>' : ''}
    ${ev.notes ? `<div class="small">${esc(ev.notes)}</div>` : ''}
  </div>
  ${ev.cancel ? `<div class="cxbox"><div class="t14" style="font-weight:800">Événement annulé</div>
    ${ev.cancelMsg ? `<div class="small">${esc(ev.cancelMsg)}</div>` : ''}
    <div class="small">Les réponses ci-dessous sont conservées, mais plus personne ne peut s’inscrire. Cet événement ne compte pas dans les présences.</div>
    <label class="f">Mot à ajouter au message (facultatif)<input class="in" data-f="shareNote" value="${esc(U.shareNote || '')}" placeholder="ex. nouvelle date à venir"></label>
    <button class="btn" data-a="share">${ICON.share} Partager l’annulation</button></div>` : ''}
  ${ev.free && ev.sideA ? `<div class="card vs"><div class="t14 center">${ev.sideA.map(k => esc(nameOf(k))).join('<br>')}</div><div class="small" style="font-weight:800">VS</div><div class="t14 center">${ev.sideB.map(k => esc(nameOf(k))).join('<br>')}</div></div>` : ''}
  ${concerned && !ev.cancel ? vParticipation(ev, my) : ''}
  ${ev.group && !ev.cancel ? vSlots(ev) : ''}
  ${(isGolf(ev.type) || isSkills(ev.type)) && !ev.cancel ? `<button class="ev" data-a="openResults" style="padding:14px 16px;border-radius:18px">
    <span style="width:40px;height:40px;flex-shrink:0;border-radius:12px;background:var(--gl);color:var(--gd);display:flex;align-items:center;justify-content:center">${ICON.trophy}</span>
    <span class="grow"><span class="t15" style="font-weight:800">Résultats</span><span class="small">${esc(resSummary)}</span></span>${ICON.chev}</button>` : ''}
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="toprow"><div style="font-size:16px;font-weight:800">Réponses</div><div class="small">${yes}${ev.max ? ' / ' + ev.max : ''} présents · ${no} absents · ${pool.length - yes - no} sans réponse</div></div>
    ${canSet ? '<div class="small">Capitaine : touche le statut d’un joueur pour le changer (À répondre → Présent → Absent).</div>' : ''}
    <div class="list">${rows.map(x => `<div class="li"><div class="av">${esc(initials(nameOf(x.k)))}</div><div class="grow t14" style="font-weight:600">${esc(nameOf(x.k))}${x.k === mk ? ' (toi)' : ''}</div>
      ${canSet ? `<button class="pill ${x.v} click" data-a="cycle" data-v="${esc(x.k)}" aria-label="Changer la présence de ${esc(nameOf(x.k))}">${ST[x.v]}</button>` : `<span class="pill ${x.v}">${ST[x.v]}</span>`}</div>`).join('') || '<div class="li small">Aucun joueur.</div>'}</div>
  </div>
  ${!ev.cancel && U.justCreated ? `<div class="newbox"><div class="t14" style="font-weight:800">${ev.open ? 'Appel lancé' : 'Événement créé'}</div>
    <div class="small">${ev.open ? 'Il apparaît dans l’agenda de tout l’effectif. Préviens le groupe pour que quelqu’un le voie aujourd’hui.' : 'Préviens l’équipe pour que personne ne le manque.'}</div></div>` : ''}
  ${!ev.cancel ? `<div style="display:flex;flex-direction:column;gap:8px">
    <label class="f">Mot à ajouter au message (facultatif)<input class="in" data-f="shareNote" value="${esc(U.shareNote || '')}" placeholder="ex. n’oubliez pas vos cartes"></label>
    <div class="row2"><button class="btn ${U.justCreated ? 'primary' : ''}" data-a="share">${ICON.share} Partager</button>
    <button class="btn" data-a="share" data-v="remind">${ICON.share} Rappel</button></div>
    <div class="small">Ton mot se place juste sous le titre. Le bouton prépare le message et te laisse choisir où l’envoyer — groupe WhatsApp, SMS ou e-mail.</div></div>` : ''}
  ${cap && !ev.free && !ev.cancel ? `<button class="btn ${ev.imp ? 'sel' : ''}" data-a="toggleImp">${ev.imp ? 'Retirer le marquage' : 'Marquer comme important'}</button>` : ''}
  ${canCancel ? (ev.cancel ? `<button class="btn" data-a="uncancel">Rétablir l’événement</button>`
    : U.cancelAsk ? `<div class="cxbox"><div class="t14" style="font-weight:800">Annuler cet événement ?</div>
        <div class="small">Il reste visible dans l’agenda, grisé et barré. Les réponses sont conservées et il ne compte plus dans les présences.</div>
        <label class="f">Motif (facultatif)<input class="in" data-f="cancelMsg" value="${esc(U.cancelMsg || '')}" placeholder="ex. terrain impraticable"></label>
        <div class="flex"><button class="btn" data-a="cancelAsk" data-v="0">Retour</button><button class="btn primary" data-a="doCancel">Annuler l’événement</button></div></div>`
      : `<button class="btn" data-a="cancelAsk" data-v="1">Annuler l’événement</button>`) : ''}
  ${canEdit && !ev.cancel ? `<div class="row2"><button class="btn" data-a="editEvent">Modifier</button><button class="btn" data-a="dupEvent">Dupliquer</button></div>` : ''}
  ${canDelete && !canEdit && ev.org && ev.org !== mk ? `<div class="small">Organisé par ${esc(nameOf(ev.org))}. Tu peux supprimer, mais pas modifier.</div>` : ''}
  ${canDelete ? (U.confirmDel ? `<div class="card" style="background:var(--redl);border-color:#E8C9C3"><div class="t14" style="color:var(--red)">Supprimer définitivement ?</div><div class="flex"><button class="btn" data-a="confirmDel" data-v="0">Annuler</button><button class="btn" style="background:var(--red);border-color:var(--red);color:#fff" data-a="doDelete">Supprimer</button></div></div>`
    : `<button class="btn danger" data-a="confirmDel" data-v="1">${ev.free ? 'Supprimer la partie' : 'Supprimer l’événement'}</button>`)
    : (ev.free && isCapReal() ? '<div class="small center">Passe en vue Cap. pour pouvoir supprimer cette partie.</div>' : '')}
  </div>`;
}

/* Nos joueurs engages dans les parties d'un match : pour la saisie des
   pars et birdies, qui n'existe que sur les matchs. */
function matchKeys(ev) {
  const P = ev.parties || (ev.sideA ? [{ a: ev.sideA, b: ev.sideB }] : []);
  const mine = (S.team && S.team.memberKeys) || [], seen = [];
  P.forEach(pt => [...(pt.a || []), ...(Array.isArray(pt.b) ? pt.b : [])]
    .forEach(k => { if (mine.includes(k) && !seen.includes(k)) seen.push(k); }));
  return seen;
}

/* ---------- results ---------- */
function vResults(ev) {
  const mk = me(), cap = capView(), isIC = isTeamMatch(ev.type);
  let html = `<div class="top"><div><button class="back" data-a="backDetail">${ICON.back}Événement</button></div>
  <div style="display:flex;flex-direction:column;gap:4px"><h2>Résultats</h2><div class="t14">${esc(ev.title)}</div><div class="small">${esc(typeText(ev))} · ${longDate(ev.date)}</div></div></div>
  <div class="scroll" id="scroll" style="gap:14px">`;
  if (isMPt(ev.type)) {
    const P = ev.parties || (ev.sideA ? [{ a: ev.sideA, b: ev.sideB }] : []);
    const inParty = pt => [...(pt.a || []), ...(Array.isArray(pt.b) ? pt.b : [])].includes(mk);
    const canRes = ev.free ? (ev.invited || []).includes(mk) : cap;
    let won = 0, lost = 0, any = false;
    const cards = P.map((pt, i) => {
      const aT = names(pt.a), bT = names(pt.b); let txt, cls;
      if (pt.outcome === 'win') { txt = aT + ' gagne · ' + pt.margin; cls = 'win'; won++; any = true; }
      else if (pt.outcome === 'loss') { txt = bT + ' gagne · ' + pt.margin; cls = 'loss'; lost++; any = true; }
      else if (pt.outcome === 'half') { txt = 'Partagé (AS)'; cls = ''; won += .5; lost += .5; any = true; }
      else { txt = 'Résultat à saisir'; cls = 'none'; }
      const four = pt.four !== undefined ? pt.four : ev.format === 'foursome';
      return `<div class="card" style="padding:12px 14px;gap:10px">
      ${isIC ? `<div style="display:flex;align-items:center;gap:8px"><span class="order">Départ n°${i + 1}</span><span class="small" style="flex:1;font-weight:700">${four ? 'Foursome' : 'Simple'}</span>
        ${cap ? `<button class="mini" data-a="move" data-v="${i}:-1" aria-label="Monter">${ICON.up}</button><button class="mini" data-a="move" data-v="${i}:1" aria-label="Descendre">${ICON.down}</button>` : ''}</div>` : ''}
      <div class="vs"><div class="t14" style="font-size:13px">${esc(aT)}</div><div class="small" style="font-weight:800">VS</div><div class="t14" style="font-size:13px;text-align:right">${esc(bT)}</div></div>
      <div class="toprow" style="flex-wrap:wrap"><span class="pill ${cls}" style="max-width:100%">${esc(txt)}</span>
      ${canRes || inParty(pt) ? `<span style="display:flex;gap:6px;margin-left:auto">${cap && !ev.free ? `<button class="edit" style="color:var(--red)" data-a="delParty" data-v="${i}" aria-label="Retirer cette partie">Retirer</button>` : ''}<button class="edit" data-a="editParty" data-v="${i}">${pt.outcome ? 'Modifier' : 'Saisir'}</button></span>` : ''}</div></div>`;
    }).join('');
    const ep = has(U.pEdit) && P[U.pEdit] ? P[U.pEdit] : null;
    html += `<div class="toprow"><div style="font-size:16px;font-weight:800">${isIC ? 'Ordre de départ' : 'Parties'}</div>
      <div style="font-size:13px;font-weight:800;color:var(--g)">${!ev.free && any ? (isIC ? 'Nous ' + half(won) + ' – ' + half(lost) + ' ' + esc(ev.club || '') : 'Équipe ' + half(won) + ' – ' + half(lost)) : ''}</div></div>
      ${cards || '<div class="small">Aucune partie encore.' + (cap && !ev.free ? ' Ajoute les départs ci-dessous.' : '') + '</div>'}`;
    if (ep && (canRes || inParty(ep))) {
      const M = (ev.holes || 18) === 9 ? M9 : M18;
      html += `<div class="panel"><div class="t14" style="font-weight:800">Qui gagne ?</div>
      <button class="btn left ${U.pOut === 'win' ? 'sel' : ''}" data-a="pOut" data-v="win">${esc(names(ep.a))} gagne</button>
      <button class="btn left ${U.pOut === 'half' ? 'sel' : ''}" data-a="pOut" data-v="half">Partagé (all square)</button>
      <button class="btn left ${U.pOut === 'loss' ? 'sel' : ''}" data-a="pOut" data-v="loss">${esc(names(ep.b))} gagne</button>
      ${U.pOut !== 'half' ? `<label class="f">Écart<select class="in" data-f="pMargin">${M.map(m => `<option ${m === U.pMargin ? 'selected' : ''}>${m}</option>`).join('')}</select></label>` : ''}
      <div class="flex"><button class="btn" data-a="cancelParty">Annuler</button><button class="btn primary" data-a="saveResult">Valider</button></div></div>`;
    }
    if (((cap && !ev.free) || (ev.open && ev.org === mk)) && !ep) {
      if (!U.addParty) html += `<button class="btn dashed" data-a="openAddParty">${isIC ? '+ Ajouter un départ' : '+ Ajouter une partie'}</button>`;
      else {
        const pres = members().filter(p => (ev.r || {})[p.k] === 'yes');
        const poolP = pres.length ? pres : members();
        const openSelf = ev.open && ev.org === mk;
        const four = isIC ? !!U.npFour : ev.format === 'foursome';
        const opts = sel => `<option value="">Choisir…</option>` + poolP.map(p => `<option value="${esc(p.k)}" ${p.k === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
        html += `<div class="panel"><div class="t14" style="font-weight:800">${isIC ? 'Départ n°' + (P.length + 1) : four ? 'Nouveau foursome' : 'Nouveau simple'}</div>
        ${isIC ? `<div class="row2"><button class="btn ${!four ? 'sel' : ''}" data-a="npFour" data-v="0">Simple</button><button class="btn ${four ? 'sel' : ''}" data-a="npFour" data-v="1">Foursome</button></div>` : ''}
        <label class="f">Notre joueur<select class="in" data-f="npA1">${opts(U.npA1)}</select></label>
        ${four ? `<label class="f">Son partenaire<select class="in" data-f="npA2">${opts(U.npA2)}</select></label>` : ''}
        ${openSelf ? `<label class="f">Son adversaire<select class="in" data-f="npB2">${opts(U.npB2)}</select></label>`
          : `<label class="f">${isIC ? 'Adversaire (facultatif)' : 'Adversaire(s)'}<input class="in" data-f="npB" value="${esc(U.npB)}" placeholder="Nom de l’adversaire"></label>`}
        ${U.partyErr ? `<div class="err">${esc(U.partyErr)}</div>` : ''}
        <div class="flex"><button class="btn" data-a="closeAddParty">Annuler</button><button class="btn primary" data-a="saveParty">Ajouter</button></div></div>`;
      }
    }
    if (!cap && P.some(inParty)) html += `<div class="small">Tu peux saisir le résultat de ta propre partie. Les autres sont saisies par leur joueur ou par le capitaine.</div>`;
    const mks = matchKeys(ev), ex2 = ev.extra || {};
    if (mks.length) {
      const canX = ev.free ? (ev.invited || []).includes(mk) : cap;
      html += `<div class="toprow"><div style="font-size:16px;font-weight:800">Pars et birdies</div><div class="small" style="font-weight:700">facultatif</div></div>
      <div class="list">${mks.map(k => {
        const e = ex2[k] || {}, mine2 = canX || k === mk;
        return `<div class="li" style="gap:8px"><div class="grow t14" style="font-weight:600">${esc(nameOf(k))}</div>
        ${mine2
          ? `<input class="in num" type="number" inputmode="numeric" min="0" max="18" data-pb="${esc(k)}|pars" value="${esc(e.pars || '')}" placeholder="pars" aria-label="Pars de ${esc(nameOf(k))}">
             <input class="in num" type="number" inputmode="numeric" min="0" max="18" data-pb="${esc(k)}|birdies" value="${esc(e.birdies || '')}" placeholder="bird." aria-label="Birdies de ${esc(nameOf(k))}">`
          : `<span class="pill">${has(e.pars) ? e.pars + ' pars' : '—'}${has(e.birdies) ? ' · ' + e.birdies + ' bird.' : ''}</span>`}</div>`;
      }).join('')}</div>
      <div class="small">Nombre de trous joués en par et en birdie. Ces chiffres n'entrent pas dans le résultat de la rencontre.</div>`;
    }
  }
  if (isSkills(ev.type)) {
    const pool = ev.free ? (ev.invited || []) : (S.team.memberKeys || []);
    const ys = pool.filter(k => (ev.r || {})[k] === 'yes');
    const sc = ev.scores || {};
    const tot = k => { const v = sc[k] || {}; return has(v.a) || has(v.p) ? Number(v.a || 0) + Number(v.p || 0) : null; };
    const vals = ys.map(tot).filter(v => v !== null);
    html += `<div class="card" style="padding:12px 14px;white-space:pre-line">${esc(has(ev.rules) ? ev.rules : SKILL_RULES)}</div>
    <div class="toprow"><div style="font-size:16px;font-weight:800">Classement</div><div class="small" style="font-weight:700">approche + putting</div></div>
    <div class="list">${ys.map(k => {
      const v = sc[k] || {}, t = tot(k), pos = t !== null ? 1 + vals.filter(x => x > t).length : '';
      const mine = cap || k === mk;
      return `<div class="li" style="padding:8px 14px;gap:8px"><div class="pos ${pos === 1 ? 'first' : ''}">${pos}</div>
      <div class="grow"><span class="t14" style="font-weight:600">${esc(nameOf(k))}</span><span style="font-size:11px;font-weight:600;color:var(--g)">${t !== null ? 'Total ' + t + ' pts' : 'À saisir'}</span></div>
      ${mine
        ? `<input class="in num" type="number" inputmode="numeric" min="0" data-sk="${esc(k)}|a" value="${has(v.a) ? esc(v.a) : ''}" placeholder="app." aria-label="Points d’approche de ${esc(nameOf(k))}">
           <input class="in num" type="number" inputmode="numeric" min="0" data-sk="${esc(k)}|p" value="${has(v.p) ? esc(v.p) : ''}" placeholder="putt" aria-label="Points de putting de ${esc(nameOf(k))}">`
        : `<span class="pill">${has(v.a) ? v.a : '—'} / ${has(v.p) ? v.p : '—'}</span>`}</div>`;
    }).join('') || '<div class="li small">Aucun joueur n’a confirmé sa participation.</div>'}</div>
    <div class="small">Deux totaux par joueur : approche puis putting. ${cap ? 'Le capitaine saisit tous les totaux ; chaque joueur saisit le sien.' : 'Tu saisis tes totaux ; le classement se met à jour.'} Enregistré dès que tu quittes la case.</div>`;
  }
  if (isCourse(ev.type)) {
    const pool = ev.free ? (ev.invited || []) : (S.team.memberKeys || []);
    const ys = pool.filter(k => (ev.r || {})[k] === 'yes');
    const sc = ev.scores || {}, ex = ev.extra || {};
    const vals = ys.map(k => sc[k]).filter(has).map(Number);
    html += `<div class="toprow"><div style="font-size:16px;font-weight:800">Classement</div><div class="small" style="font-weight:700">Stableford · points</div></div>
    <div class="list">${ys.map(k => {
      const v = sc[k], hv = has(v); const pos = hv ? 1 + vals.filter(x => x > Number(v)).length : '';
      const editable = cap || k === mk; const e = ex[k];
      const exText = e ? `Putts ${e.putts || '—'} · GIR ${has(e.gir) ? e.gir + '/' + holesOf(ev) : '—'} · App. ${e.udOk || 0}/${e.udTry || 0} · Sandy ${e.sOk || 0}/${e.sTry || 0}` : (editable ? '+ putts, GIR, approche-put, sandy' : '');
      return `<div class="li" style="padding:8px 14px"><div class="pos ${pos === 1 ? 'first' : ''}">${pos}</div>
      ${editable ? `<button class="grow" style="border:none;background:none;text-align:left;padding:4px 0" data-a="openExtra" data-v="${esc(k)}"><span class="t14" style="font-weight:600">${esc(nameOf(k))}</span><span style="font-size:11px;font-weight:600;color:var(--g)">${esc(exText)}</span></button>
        <input class="in num" type="number" inputmode="numeric" min="0" max="60" data-score="${esc(k)}" value="${hv ? esc(v) : ''}" aria-label="Points Stableford de ${esc(nameOf(k))}">`
        : `<div class="grow"><span class="t14" style="font-weight:600">${esc(nameOf(k))}</span><span class="small" style="font-size:11px">${esc(exText)}</span></div><div class="t15" style="width:72px;text-align:center">${hv ? esc(v) : '—'}</div>`}
      <div class="small" style="width:24px">pts</div></div>`;
    }).join('') || '<div class="li small">Aucun joueur n’a confirmé sa participation.</div>'}</div>`;
    if (U.xEdit && ys.includes(U.xEdit)) {
      const num = (l, f) => `<label class="f" style="font-size:12px">${l}<input class="in" type="number" inputmode="numeric" min="0" data-f="${f}" value="${esc(U[f])}" style="text-align:center;font-weight:700"></label>`;
      html += `<div class="panel"><div class="t14" style="font-weight:800">Petit jeu · ${esc(nameOf(U.xEdit))}</div>
      <div class="row2">${num('Nombre de putts (total)', 'xPutts')}${num('Greens en régulation', 'xGir')}</div>
      <div class="small">Green en régulation : la balle est sur le green en deux coups de moins que le par (1 coup sur un par 3).</div>
      <div class="small">Approche-put : approche + 1 putt pour sauver le par (ou mieux). Sandy : sortie de bunker + 1 putt.</div>
      <div class="row2">${num('Approche-put réussis', 'xUdOk')}${num('Approche-put tentés', 'xUdTry')}${num('Sandy réussis', 'xSOk')}${num('Sandy tentés', 'xSTry')}</div>
      ${U.xErr ? `<div class="err">${esc(U.xErr)}</div>` : ''}
      <div class="flex"><button class="btn" data-a="cancelExtra">Annuler</button><button class="btn primary" data-a="saveExtra">Valider</button></div></div>`;
    }
    html += `<div class="small">${cap ? 'Le capitaine peut saisir tous les scores ; chaque joueur saisit le sien.' : 'Tu saisis ton score ; le classement se met à jour.'} Le score est enregistré dès que tu quittes la case.</div>`;
  }
  return html + '</div>';
}

/* ---------- add event ---------- */
function vAdd() {
  const cap = capView(), types = cap ? TYPES : TYPES.filter(t => PLAYER_TYPES.includes(t.v));
  const f = U.f;
  const others = members().filter(p => p.k !== me());
  const opts = sel => `<option value="">Choisir…</option>` + others.map(p => `<option value="${esc(p.k)}" ${p.k === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  const isMatch = f.type === 'matchplay' || f.type === 'redtide', isIC = isTeamMatch(f.type);
  return `<div class="top"><div class="toprow"><button class="back" style="color:var(--mut)" data-a="backList">Annuler</button><div class="t15" style="font-weight:800">${U.edit ? 'Modifier' : cap ? 'Nouvel événement' : 'Nouvelle partie'}</div><button class="back" data-a="saveEvent">${U.edit ? 'Enregistrer' : 'Créer'}</button></div></div>
  <div class="scroll" id="scroll" style="gap:16px">
  ${U.edit ? `<div class="small">Les réponses des joueurs et les résultats déjà saisis sont conservés.${!cap ? ' Les joueurs de la partie ne sont pas modifiables ici.' : ''}</div>` : ''}

function parseImport(txt) {
  const out = [], seen = {};
  String(txt || '').split(/\r?\n/).forEach((line, i) => {
    const raw = line.trim();
    if (!raw || /^(nom|name)\s*[;\t]/i.test(raw)) return;
    const f = raw.split(/[;\t]/).map(x => x.trim());
    const name = f[0] || '', email = (f[1] || '').toLowerCase(), hcp = (f[2] || '').replace(',', '.'), phone = f[3] || '';
    const born = toISODate(f[4] || '');
    const r = { line: i + 1, name, email, hcp, phone, born: born || '', err: '' };
    if (!name) r.err = 'nom manquant';
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) r.err = 'e-mail invalide';
    else if (seen[K(email)]) r.err = 'doublon dans la liste';
    else if ((S.team.memberKeys || []).includes(K(email))) r.err = 'déjà dans l’effectif';
    else if (phone && !okPhone(phone)) r.err = 'n° de GSM invalide';
    else if (born === null || !validDate(born)) r.err = 'date de naissance invalide';
    if (!r.err) seen[K(email)] = 1;
    out.push(r);
  });
  return out;
}
/* Reconnait la colonne d'apres son intitule, quels que soient l'ordre,
   la casse et les accents — un export peut nommer ses colonnes autrement. */
function colIndex(hdr, words) {
  const nrm = x => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  for (let i = 0; i < hdr.length; i++) { const h = nrm(hdr[i]); if (words.some(w => h.startsWith(w))) return i; }
  return -1;
}
function sheetToLines(rows) {
  const isMail = v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(v || '').trim());
  let hi = -1, cNom = -1, cMail = -1;
  for (let i = 0; i < Math.min(rows.length, 30); i++) {
    const r = rows[i] || [];
    const m = colIndex(r, ['e-mail', 'email', 'mail', 'adresse e']);
    const nm = colIndex(r, ['nom', 'joueur', 'name']);
    if (m >= 0 && nm >= 0) { hi = i; cMail = m; cNom = nm; break; }
  }
  if (hi < 0) return { lines: [], why: 'aucune ligne d’en-tête avec les colonnes « Nom » et « E-mail »' };
  const hdr = rows[hi];
  const cHcp = colIndex(hdr, ['hcp', 'handicap', 'whs']);
  const cGsm = colIndex(hdr, ['gsm', 'portable', 'tel', 'tél', 'mobile', 'n° de gsm']);
  const cNe = colIndex(hdr, ['date de naissance', 'naissance', 'ne le', 'né le', 'birth']);
  const out = [];
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i] || [];
    if (!isMail(r[cMail])) { if (out.length) break; continue; }  // s'arrête au bloc de synthèse
    const nom = String(r[cNom] || '').trim();
    let hcp = cHcp >= 0 ? r[cHcp] : '';
    hcp = (hcp === null || hcp === undefined || hcp === '') ? '' : String(typeof hcp === 'number' ? Math.round(hcp * 10) / 10 : hcp).replace(',', '.');
    const gsm = cGsm >= 0 ? String(r[cGsm] || '').trim() : '';
    let ne = cNe >= 0 ? r[cNe] : '';
    if (ne instanceof Date) ne = ne.getFullYear() + '-' + String(ne.getMonth() + 1).padStart(2, '0') + '-' + String(ne.getDate()).padStart(2, '0');
    else ne = String(ne || '').trim().split(' ')[0];
    out.push([nom, String(r[cMail]).trim(), hcp, gsm, ne].join(';'));
  }
  return { lines: out, why: out.length ? '' : 'aucune ligne avec une adresse e-mail valide' };
}

    if (window.XLSX) return ok(window.XLSX);
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = () => window.XLSX ? ok(window.XLSX) : no(new Error('lib'));
    sc.onerror = () => { _xlsxLib = null; no(new Error('réseau')); };
    document.head.appendChild(sc);
  });
  return _xlsxLib;
}
function readExcel(f) {
  U.impErr = ''; U.impBusy = true; U.impFile = f.name; render();
  loadXlsx().then(XLSX => {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' });
        let best = null;
        for (const nm of wb.SheetNames) {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[nm], { header: 1, raw: true, defval: '' });
          const r = sheetToLines(rows);
          if (r.lines.length) { best = { nm, ...r }; break; }
          if (!best) best = { nm, ...r };
        }
        U.impBusy = false;
        if (!best || !best.lines.length) {
          U.impErr = 'Rien à importer dans ce classeur : ' + ((best && best.why) || 'feuille vide') + '.';
          U.impFile = ''; return render();
        }
        U.impTxt = best.lines.join('\n');
        U.impSheet = wb.SheetNames.length > 1 ? best.nm : '';
        U.impLog = null; render();
      } catch (e) {
        U.impBusy = false; U.impErr = 'Fichier Excel illisible (' + (e.message || e) + ').'; U.impFile = ''; render();
      }
    };
    fr.onerror = () => { U.impBusy = false; U.impErr = 'Lecture du fichier impossible.'; U.impFile = ''; render(); };
    fr.readAsArrayBuffer(f);
  }, () => {
    U.impBusy = false; U.impFile = '';
    U.impErr = 'Impossible de charger le lecteur Excel (connexion ?). Enregistre le fichier en CSV et dépose-le à nouveau.';
    render();
  });
}

function readImportFile(f) {
  if (!f) return;
  if (/\.(xlsx|xlsm|xls)$/i.test(f.name)) return readExcel(f);
  if (/\.(ods|numbers)$/i.test(f.name)) {
    U.impErr = 'Ce format n’est pas lu ici. Enregistre le fichier en .xlsx ou en .csv, puis dépose-le à nouveau.';
    return render();
  }
  if (f.size > 300000) { U.impErr = 'Fichier trop volumineux (max 300 Ko).'; return render(); }
  const fr = new FileReader();
  fr.onload = () => {
    let t = String(fr.result || '').replace(/^\uFEFF/, '');
    U.impTxt = t; U.impFile = f.name; U.impSheet = ''; U.impErr = ''; U.impLog = null;
    if (!parseImport(t).some(r => !r.err)) U.impErr = 'Aucune ligne exploitable dans ce fichier. Format attendu : Nom ; e-mail ; handicap ; GSM ; date de naissance.';
    render();
  };
  fr.onerror = () => { U.impErr = 'Lecture du fichier impossible.'; render(); };
  fr.readAsText(f, 'utf-8');
}

function vStats() {
  const St = computeStats(), M = members();
  const rec = r => r.w + '-' + r.h + '-' + r.l;
  const row = (r, act, v) => `<button class="li" data-a="${act}" data-v="${esc(r.k)}"><span class="pos ${r.pos === 1 ? 'first' : ''}">${r.pos}</span><span class="grow"><span class="t14">${esc(r.name)}</span><span class="small">${esc(r.sub)}</span></span><span class="t15" style="font-weight:800">${esc(r.value)}</span></button>`;
  let html = vHeader('Statistiques') + `<div class="scroll" id="scroll"><div class="tabs" style="grid-template-columns:repeat(4,1fr)">
  ${[['mp', 'Match play'], ['score', 'Stableford'], ['sk', 'Approche'], ['put', 'Putting'], ['pres', 'Présences']].map(([k, l]) => `<button class="tab ${U.statTab === k ? 'on' : ''}" data-a="statTab" data-v="${k}" style="font-size:11px">${l}</button>`).join('')}</div>`;
  if (U.statTab === 'mp') {
    const rows = rankRows(M.filter(p => St[p.k].mp.length).map(p => { const x = St[p.k]; return { k: p.k, name: p.name, pts: x.pts, sub: 'Simple ' + rec(x.mpS) + ' · Foursome ' + rec(x.mpF) + (x.pb.rounds ? ' · ' + pbText(x.pb) : ''), value: fmtPts(x.pts) }; }), (a, b) => b.pts - a.pts);
    html += `<div class="small">Simple et foursome · victoire 1 pt, partagé ½ · V-N-D = victoires, nuls, défaites. Touche un joueur pour voir sa fiche.</div><div class="list">${rows.map(r => row(r, 'openPlayer')).join('') || '<div class="li small">Aucun match play saisi.</div>'}</div>`;
  } else if (U.statTab === 'score') {
    [['stab18', 'Stableford 18 trous'], ['stab9', 'Stableford 9 trous']].forEach(([k, t]) => {
      const rows = rankRows(M.filter(p => St[p.k][k].length).map(p => { const a = St[p.k][k], m = avg(a); return { k: p.k, name: p.name, m, sub: a.length + (a.length > 1 ? ' parties' : ' partie') + ' · meilleur ' + Math.max(...a), value: fmtN(m) }; }), (a, b) => b.m - a.m);
      if (rows.length) html += `<div class="toprow" style="padding:0 4px"><div class="t14" style="font-weight:800">${t}</div><div class="small">moyenne en points</div></div><div class="list">${rows.map(r => row(r, 'openPlayer')).join('')}</div>`;
    });
    if (!M.some(p => St[p.k].stab18.length || St[p.k].stab9.length)) html += '<div class="small center" style="padding:20px">Aucun score Stableford saisi.</div>';
  } else if (U.statTab === 'sk') {
    const rows = rankRows(M.filter(p => St[p.k].sk.n).map(p => {
      const K2 = St[p.k].sk, m = (K2.a + K2.p) / K2.n;
      return { k: p.k, name: p.name, m,
        sub: K2.n + (K2.n > 1 ? ' concours' : ' concours') + ' · approche ' + fmtN(K2.a / K2.n) + ' · putting ' + fmtN(K2.p / K2.n) + ' · meilleur ' + K2.best,
        value: fmtN(m) };
    }), (a, b) => b.m - a.m);
    html += `<div class="small">Moyenne de points par concours, approche et putting cumulés</div><div class="list">${rows.map(r => row(r, 'openPlayer')).join('') || '<div class="li small">Aucun résultat d’approche et putting saisi.</div>'}</div>`;
  } else if (U.statTab === 'put') {
    const rows = rankRows(M.filter(p => { const P = St[p.k].put; return P.holes || P.udTry || P.sTry || P.girHoles; }).map(p => {
      const P = St[p.k].put, ppt = P.holes ? P.putts / P.holes : 99;
      return { k: p.k, name: p.name, ppt, sub: 'GIR ' + (P.girHoles ? pct(P.girOk, P.girHoles) : '—') + ' · App.-put ' + P.udOk + '/' + P.udTry + ' (' + pct(P.udOk, P.udTry) + ') · Sandy ' + P.sOk + '/' + P.sTry + ' (' + pct(P.sOk, P.sTry) + ')', value: P.holes ? ppt.toFixed(2).replace('.', ',') + '/t' : '—' };
    }), (a, b) => a.ppt - b.ppt);
    html += `<div class="small">Classés par putts par trou (9 et 18 trous comparables) · GIR, approche-put et sandy en % de réussite</div><div class="list">${rows.map(r => row(r, 'openPlayer')).join('') || '<div class="li small">Aucune donnée de putting.</div>'}</div>`;
  } else {
    const rows = rankRows(M.map(p => { const x = St[p.k], pc = x.conv ? Math.round(100 * x.yes / x.conv) : 0; return { k: p.k, name: p.name, pc, sub: x.yes + ' / ' + x.conv + ' événements', value: pc + ' %' }; }), (a, b) => b.pc - a.pc);
    html += `<div class="small">Présences confirmées sur les événements où le joueur est convoqué ou invité</div><div class="list">${rows.map(r => row(r, 'openPlayer')).join('')}</div>`;
  }
  return html + '</div>';
}

/* ---------- actions ---------- */
/* Remplit le formulaire a partir d'un evenement existant : seule sa
   definition, jamais les reponses, scores, parties ni creneaux lies.
   Sert a la modification comme a la duplication. */
/* Un evenement porte-t-il deja des resultats ? Sert a prevenir avant
   un changement de type qui les rendrait invisibles. */
function evHasResults(ev) {
  if (!ev) return false;
  if ((ev.parties || []).some(p => p.outcome)) return true;
  if (Object.values(ev.scores || {}).some(v => v !== '' && v !== null && v !== undefined)) return true;
  return Object.keys(ev.extra || {}).length > 0;
}

/* L'e-mail est la cle du joueur : le changer deplace members, memberKeys,
   captains, sa fiche de contact et sa trace dans chaque evenement
   (reponses, scores, stats, parties, invites, organisateur). Tout part
   en un seul writeBatch : soit l'ensemble passe, soit rien. */
function renameKey(oldK, newK) {
  const b = writeBatch(db), T = S.team;
  const m = Object.assign({}, T.members[oldK] || {});
  m.email = String(newK).replace(/,/g, '.');
  const tref = doc(db, 'teams', S.teamId);
  const up = { ['members.' + oldK]: deleteField(), ['members.' + newK]: m,
               memberKeys: (T.memberKeys || []).map(k => k === oldK ? newK : k) };
  if ((T.captains || []).includes(oldK)) up.captains = T.captains.map(k => k === oldK ? newK : k);
  b.update(tref, up);
  const ct = S.contacts[oldK];
  if (ct) {
    const copy = Object.assign({}, ct); delete copy.id;
    b.set(doc(db, 'teams', S.teamId, 'contacts', newK), copy);
    b.delete(doc(db, 'teams', S.teamId, 'contacts', oldK));
  }
  let touched = 0;
  (S.events || []).forEach(ev => {
    const u = {};
    ['r', 'scores', 'extra'].forEach(f => {
      if (ev[f] && Object.prototype.hasOwnProperty.call(ev[f], oldK)) {
        const o = Object.assign({}, ev[f]); o[newK] = o[oldK]; delete o[oldK]; u[f] = o;
      }
    });
    const swap = a => (a || []).map(k => k === oldK ? newK : k);
    if ((ev.invited || []).includes(oldK)) u.invited = swap(ev.invited);
    if ((ev.sideA || []).includes(oldK)) u.sideA = swap(ev.sideA);
    if ((ev.sideB || []).includes(oldK)) u.sideB = swap(ev.sideB);
    if (ev.org === oldK) u.org = newK;
    if (ev.createdBy === oldK) u.createdBy = newK;
    if ((ev.parties || []).some(pt => (pt.a || []).includes(oldK) || (pt.b || []).includes(oldK)))
      u.parties = ev.parties.map(pt => Object.assign({}, pt, { a: swap(pt.a), b: Array.isArray(pt.b) ? swap(pt.b) : pt.b }));
    if (Object.keys(u).length) { b.update(evRef(ev.id), u); touched++; }
  });
  return b.commit().then(() => touched);
}

function fillForm(ev) {
  resetForm();
  Object.assign(U.f, {
    type: ev.type, title: ev.title || '', date: '', time: ev.time || '', end: ev.end || '',
    place: ev.place || '', notes: ev.notes || '', max: ev.max || '',
    format: ev.format === 'foursome' ? 'foursome' : 'single', holes: ev.holes || 18,
    home: ev.home !== false, club: ev.club || '', slots: [], imp: !!ev.imp
  });
  if (ev.free) {
    U.f.guests = (ev.invited || []).filter(k => k !== me());
    if (ev.sideA) {   // match play entre joueurs : on reprend les adversaires
      U.f.partner = (ev.sideA || []).find(k => k !== me()) || '';
      U.f.opp1 = (ev.sideB || [])[0] || ''; U.f.opp2 = (ev.sideB || [])[1] || '';

  }
}

  /* squad */
  addMember: () => { U.mEdit = '__new'; U.created = null; U.mName = U.mEmail = U.mHcp = U.mPhone = U.mBorn = U.mErr = ''; render(); },
  closeCreated: () => { U.created = null; render(); },
  createAccess: async k => {
    const m = S.team.members[k] || {}; if (!m.email) return;
    const pwd = genPwd();
    U.mErr = 'Création du compte…'; render();
    try {
      const r = await createAccount(m.email, m.name, pwd);
      if (r === 'created') { await setContact(k, { pwd, sentAt: deleteField() }); U.mErr = ''; toast('Accès créé : envoie-le maintenant'); }
      else { await setContact(k, { hasAccount: true }); U.mErr = ''; toast('Ce joueur a déjà un compte'); }
    } catch (e) { console.error(e); U.mErr = 'Erreur : ' + (e.message || e); }
    render();
  },
  copyAccess: v => { const [email, pwd, name, tt] = v.split('|'); const m = accessMsg(name, email, pwd, tt); const txt = m.subject + '\n\n' + m.body; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Message copié'), () => toast('Copie impossible sur cet appareil')); },
  editMember: k => { const m = S.team.members[k] || {}; U.mEdit = k; U.mName = m.name || ''; U.mEmail = m.email || ''; U.mHcp = m.hcp || ''; U.mPhone = phoneOf(k); U.mBorn = bornOf(k); U.mErr = ''; render(); },
  cancelMember: () => { U.mEdit = null; render(); },
  saveMember: async () => {
    const name = (U.mName || '').trim(), hcp = (U.mHcp || '').trim().replace(',', '.');
    if (!name) { U.mErr = 'Indique le nom.'; return render(); }
    const phone = (U.mPhone || '').trim();
    if (!okPhone(phone)) { U.mErr = 'N° de GSM invalide.'; return render(); }
    const born = toISODate(U.mBorn);
    if (born === null || !validDate(born)) { U.mErr = 'Date de naissance invalide.'; return render(); }
    if (U.mEdit === '__new') {
      const email = (U.mEmail || '').trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { U.mErr = 'Adresse e-mail invalide.'; return render(); }
      const k = K(email);
      if ((S.team.memberKeys || []).includes(k)) { U.mErr = 'Ce joueur est déjà dans l’effectif.'; return render(); }
      const pwd = genPwd();
      U.mErr = 'Création du compte…'; render();
      try {
        const r = await createAccount(email, name, pwd);
        const mb = { name, hcp, email }; if (born) mb.bd = born.slice(5);
        await updateDoc(doc(db, 'teams', S.teamId), { ['members.' + k]: mb, memberKeys: arrayUnion(k) });
        const ct = {}; if (phone) ct.phone = phone; if (born) ct.born = born; if (r === 'created') ct.pwd = pwd;
        if (Object.keys(ct).length) await setContact(k, ct);
        if (r === 'exists') await setContact(k, { hasAccount: true });
        U.mEdit = null; U.mErr = ''; U.created = { name, email, pwd, phone, exists: r === 'exists', key: k, tid: S.teamId };
      } catch (e) {
        console.error(e);
        U.mErr = e.code === 'auth/invalid-email' ? 'Adresse e-mail invalide.' : e.code === 'permission-denied' ? 'Action non autorisée.' : 'Erreur : ' + (e.message || e);
      }
      render();
    } else {
      const k = U.mEdit; U.mEdit = null; render();
      const demo = S.team.members[k] && S.team.members[k].demo;
      const newK = K(U.mEmail || '');
      if (!demo && newK && newK !== k) {
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test((U.mEmail || '').trim())) { U.mErr = 'Adresse e-mail invalide.'; return render(); }
        if ((S.team.memberKeys || []).includes(newK)) { U.mErr = 'Cette adresse est déjà celle d’un autre joueur de l’effectif.'; return render(); }
        const had = accessState(k) !== 'none';
        U.mEdit = null; render();
        return safe(async () => {
          const touched = await renameKey(k, newK);
          const up2 = {}; if (name !== (S.team.members[k] || {}).name) up2['members.' + newK + '.name'] = name;
          up2['members.' + newK + '.hcp'] = hcp;
          up2['members.' + newK + '.bd'] = born ? born.slice(5) : deleteField();
          await updateDoc(doc(db, 'teams', S.teamId), up2);
          if (phone) await setContact(newK, { phone });
          if (born) await setContact(newK, { born });
          toast('Adresse modifiée' + (touched ? ' · ' + touched + ' événement' + (touched > 1 ? 's' : '') + ' mis à jour' : '') +
                (had ? ' · accès à recréer' : ''));
        }, '');
      }
      safe(async () => {
        const up = { ['members.' + k + '.name']: name, ['members.' + k + '.hcp']: hcp };
        if (!demo) up['members.' + k + '.bd'] = born ? born.slice(5) : deleteField();
        await updateDoc(doc(db, 'teams', S.teamId), up);
        if (!demo && phone !== phoneOf(k)) await setPhone(k, phone);
        if (!demo && born !== bornOf(k)) await setContact(k, { born });
      }, 'Enregistré');
    }
  },
  removeMember: () => {
    const k = U.mEdit; U.mEdit = null; render();
    safe(async () => {
      await updateDoc(doc(db, 'teams', S.teamId), { ['members.' + k]: deleteField(), memberKeys: arrayRemove(k) });
      // La fiche de contact est conservée (GSM + mot de passe) : si le joueur
      // revient, ses accès sont retrouvés sans repasser par Firebase.
      if (phoneOf(k) || pwdOf(k)) await setContact(k, { left: Date.now() });
    }, 'Joueur retiré — ses accès restent mémorisés');
  },
  saveMyPhone: () => { const ph = (U.myPhone ?? phoneOf(me())).trim(); if (!okPhone(ph)) return toast('N° de GSM invalide.'); U.myPhone = undefined; safe(() => setPhone(me(), ph), 'GSM enregistré'); },
  editTitle: () => {
    const t = S.team; U.titleEdit = true;
    U.tiTitle = t.title || ('Interclub ' + (t.name || '')); U.tiName = t.name || ''; U.tiSeason = t.season || '';
    U.tiTheme = t.theme || 'none'; U.tiMsg = (t.themeMsgs || {})[U.tiTheme] || '';
    U.tiDates = JSON.parse(JSON.stringify(t.themeDates || {}));
    U.tiBdDays = String(t.bdDays == null ? 1 : t.bdDays);
    render();
  },
  cancelTitle: () => { U.titleEdit = false; render(); },
  saveTitle: () => {
    const title = (U.tiTitle || '').trim(), name = (U.tiName || '').trim(), season = (U.tiSeason || '').trim();
    if (!title || !name) return toast('Titre et nom court obligatoires.');
    /* On n'enregistre que les periodes qui different du calendrier par defaut. */
    const dates = {};
    AUTO_THEMES.forEach(([a, b, k]) => {
      const c = (U.tiDates || {})[k] || {};
      const from = c.from || a, to = c.to || b;
      if (from !== a || to !== b) dates[k] = { from, to };
    });
    U.titleEdit = false; render();
    const upd = { title, name, season, theme: U.tiTheme || 'none', bdDays: parseInt(U.tiBdDays, 10) || 0 };
    if (THEMES[U.tiTheme] && THEMES[U.tiTheme].bg) upd['themeMsgs.' + U.tiTheme] = (U.tiMsg || '').trim();
    upd.themeDates = Object.keys(dates).length ? dates : deleteField();
    safe(() => updateDoc(doc(db, 'teams', S.teamId), upd), 'Enregistré');
  },
  installNow: async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; render(); },
  installLater: () => { lsSet('ic_install_snooze', String(Date.now() + 14 * 864e5)); render(); },
  /* access requests */
  resendRequest: () => safe(() => sendRequest(), 'Demande envoyée'),
  acceptReq: id => {
    const r = S.requests.find(x => x.id === id); if (!r) return;
    safe(async () => {
      await updateDoc(doc(db, 'teams', S.teamId), { ['members.' + r.key]: { name: r.name, hcp: '', email: r.email }, memberKeys: arrayUnion(r.key) });
      if (r.phone) await setPhone(r.key, r.phone);
      await deleteDoc(doc(db, 'requests', id));
    }, r.name + ' ajouté à l’équipe');
  },
  refuseReq: id => safe(() => deleteDoc(doc(db, 'requests', id)), 'Demande refusée'),
  /* import d'une liste */
  openImport: () => { U.impOpen = true; U.impTxt = U.impTxt || ''; U.impAcc = U.impAcc !== false; U.impLog = null; U.impErr = ''; render(); },
  closeImport: () => { U.impOpen = false; U.impErr = ''; U.impFile = ''; U.impSheet = ''; render(); },
  pickFile: () => { const i = document.querySelector('[data-file]'); if (i) i.click(); },
  impAcc: v => { U.impAcc = !!Number(v); render(); },
  runImport: async () => {
    const el = document.querySelector('[data-f="impTxt"]');
    if (el) U.impTxt = el.value;
    const all = parseImport(U.impTxt), rows = all.filter(r => !r.err);
    if (!rows.length) { U.impErr = all.length ? 'Aucune ligne valide à importer.' : 'Colle d’abord la liste des joueurs.'; return render(); }
    U.impBusy = true; U.impErr = ''; U.impLog = []; render();
    for (const r of rows) {
      const k = K(r.email);
      try {
        let pwd = '', state = 'ajouté';
        if (U.impAcc) {
          pwd = genPwd();
          const res = await createAccount(r.email, r.name, pwd);
          if (res === 'exists') { pwd = ''; state = 'ajouté · compte déjà existant'; }
          else state = 'ajouté · compte créé';
        }
        const mb = { name: r.name, hcp: r.hcp, email: r.email }; if (r.born) mb.bd = r.born.slice(5);
        await updateDoc(doc(db, 'teams', S.teamId), { ['members.' + k]: mb, memberKeys: arrayUnion(k) });
        const ct = {};
        if (r.phone) ct.phone = r.phone;
        if (r.born) ct.born = r.born;
        if (pwd) ct.pwd = pwd;
        if (U.impAcc && !pwd) ct.hasAccount = true;
        if (Object.keys(ct).length) await setContact(k, ct);
        U.impLog.push({ name: r.name, email: r.email, msg: state, pwd });
      } catch (e) {
        console.error(e);
        U.impLog.push({ name: r.name, email: r.email, msg: 'échec : ' + (e.code || e.message || e), pwd: '' });
      }
      render();
    }
    U.impBusy = false;
    const okN = U.impLog.filter(l => !/échec/.test(l.msg)).length;
    toast(okN + ' joueur' + (okN > 1 ? 's' : '') + ' importé' + (okN > 1 ? 's' : ''));
    render();
  },
  copyAllAccess: () => {
    const made = (U.impLog || []).filter(l => l.pwd);
    if (!made.length) return;
    const tt = S.team ? (S.team.title || ('Interclub ' + S.team.name)) : '';
    const txt = made.map(l => { const m = accessMsg(l.name, l.email, l.pwd, tt); return m.subject + '\n\n' + m.body; }).join('\n\n' + '—'.repeat(20) + '\n\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(() => toast('Messages copiés'), () => toast('Copie impossible sur cet appareil'));
  },
  /* demo players */
  addDemo: () => {
    const n = Math.max(1, Math.min(30, Number(U.demoN || 8)));
    const first = ['Alain', 'Bruno', 'Cédric', 'David', 'Éric', 'Fabien', 'Gilles', 'Hugo', 'Ivan', 'Jules', 'Kevin', 'Louis', 'Mathieu', 'Nicolas', 'Olivier', 'Paul', 'Quentin', 'Romain', 'Simon', 'Thierry'];
    const ex = members().filter(p => S.team.members[p.k].demo).length;
    const upd = {}; const keys = [];
    for (let i = 1; i <= n; i++) {
      const num = ex + i, k = K('test' + num + '@fictif.interclub');
      upd['members.' + k] = { name: first[(num - 1) % first.length] + ' Test' + num, hcp: String(Math.round((2 + Math.random() * 18) * 10) / 10), demo: true };
      keys.push(k);
    }
    upd.memberKeys = arrayUnion(...keys);
    safe(() => updateDoc(doc(db, 'teams', S.teamId), upd), n + ' joueurs fictifs créés');
  },
  delDemo: v => { U.delDemo = !!v; render(); },
  doDelDemo: () => {
    U.delDemo = false; render();
    const keys = members().filter(p => S.team.members[p.k].demo).map(p => p.k);
    safe(async () => {
      for (const ev of S.events) {
        if (ev.free) continue;
        const upd = {};
        keys.forEach(k => {
          if (ev.r && k in ev.r) upd['r.' + k] = deleteField();
          if (ev.scores && k in ev.scores) upd['scores.' + k] = deleteField();
          if (ev.extra && k in ev.extra) upd['extra.' + k] = deleteField();
        });
        if (ev.parties && ev.parties.some(pt => (pt.a || []).concat(Array.isArray(pt.b) ? pt.b : []).some(k => keys.includes(k))))
          upd.parties = ev.parties.filter(pt => !(pt.a || []).concat(Array.isArray(pt.b) ? pt.b : []).some(k => keys.includes(k)));
        if (Object.keys(upd).length) await updateDoc(evRef(ev.id), upd);
      }
      const tu = { memberKeys: arrayRemove(...keys) }; keys.forEach(k => tu['members.' + k] = deleteField());
      await updateDoc(doc(db, 'teams', S.teamId), tu);
    }, 'Joueurs fictifs supprimés');
  },
  /* admin */
  createTeam: () => {
    const name = (U.tName || '').trim(); if (!name) return toast('Indique le nom de l’équipe.');
    const k = me(), season = (U.tSeason || '').trim();
    U.tName = U.tSeason = ''; render();
    safe(() => addDoc(collection(db, 'teams'), { name, season, captains: [], members: {}, memberKeys: [], createdAt: Date.now(), createdBy: k }), 'Équipe créée');
  },
  capTeam: v => { U.capTeam = v || null; U.cName = U.cEmail = U.cErr = U.cPick = ''; U.capCreated = null; render(); },
  addCaptain: async tid => {
    if (!U.cPick) { U.cErr = 'Choisis un joueur.'; return render(); }
    if (U.cPick !== '__new') { const m0 = (S.teams.find(x => x.id === tid).members || {})[U.cPick] || {}; U.cName = m0.name || ''; U.cEmail = m0.email || ''; }
    const email = (U.cEmail || '').trim().toLowerCase(), name = (U.cName || '').trim();
    if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { U.cErr = 'Nom et e-mail valides requis.'; return render(); }
    const k = K(email); const t = S.teams.find(x => x.id === tid); const inTeam = t.members && t.members[k];
    const pwd = genPwd();
    U.cErr = 'Création du compte…'; render();
    try {
      const r = await createAccount(email, name, pwd);
      const upd = { captains: arrayUnion(k), memberKeys: arrayUnion(k) };
      if (!inTeam) upd['members.' + k] = { name, hcp: '', email };
      await updateDoc(doc(db, 'teams', tid), upd);
      if (r === 'created') await setContact(k, { pwd }, tid);
      await syncCaptainIndex(S.teams.map(x => x.id === tid ? { ...x, captains: Array.from(new Set((x.captains || []).concat([k]))) } : x));
      U.capTeam = null; U.cErr = ''; U.capCreated = { name, email, pwd, exists: r === 'exists', team: t.title || ('Interclub ' + t.name), key: k, tid };
    } catch (e) { console.error(e); U.cErr = 'Erreur : ' + (e.message || e); }
    render();
  },
  closeCapCreated: () => { U.capCreated = null; render(); },
  removeCaptain: v => {
    const [tid, k] = v.split('|');
    safe(async () => {
      await updateDoc(doc(db, 'teams', tid), { captains: arrayRemove(k) });
      await syncCaptainIndex(S.teams.map(x => x.id === tid ? { ...x, captains: (x.captains || []).filter(c => c !== k) } : x));
    }, 'Capitaine retiré');
  },
  delTeam: v => { U.delTeam = v || null; render(); },
  doDelTeam: tid => { U.delTeam = null; render(); safe(async () => { await deleteDoc(doc(db, 'teams', tid)); await syncCaptainIndex(S.teams.filter(x => x.id !== tid)); }, 'Équipe supprimée'); }
};

/* ---------- event wiring ---------- */
root.addEventListener('click', e => {
  const mkEl = e.target.closest('[data-mark]');
  if (mkEl && db) { const [k, tid] = mkEl.dataset.mark.split('|'); if (k) setContact(k, { sentAt: Date.now() }, tid || undefined).catch(err => console.error(err)); }
  const b = e.target.closest('[data-a]'); if (!b || !root.contains(b)) return;
  const fn = A[b.dataset.a]; if (fn) { e.preventDefault(); fn(b.dataset.v); }
});
function setField(el) {
  const f = el.dataset.f; if (!f) return;
  if (f === 'teamPick') { U.titleEdit = false; S.teamId = el.value; U.view = 'list'; U.todayScroll = true; subscribeTeam(); render(); return; }
  if (f === 'tiTheme') { U.tiTheme = el.value; U.tiMsg = ((S.team && S.team.themeMsgs) || {})[el.value] || ''; render(); return; }
  if (f.startsWith('slot.')) { const [, i, key] = f.split('.'); U.f.slots[Number(i)][key] = el.value; }
  else if (f === 'f.terr') { U.f.place = el.value; }
  else if (f.startsWith('guest.')) {
    const i = Number(f.split('.')[1]), g = (U.f.guests || []).slice();
    g[i] = el.value; U.f.guests = g.filter(Boolean);
  }
  else if (f.startsWith('tiDate.')) {
    const [, k, side] = f.split('.');
    U.tiDates = U.tiDates || {};
    U.tiDates[k] = Object.assign({}, U.tiDates[k], { [side]: dateToMd(el.value) });
  }
  else if (f.startsWith('f.')) U.f[f.slice(2)] = el.value; else U[f] = el.value;
  if (el.dataset.r) render();
}
root.addEventListener('input', e => { if (e.target.tagName !== 'SELECT') setField(e.target); });
root.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.score !== undefined) {
    const k = el.dataset.score, v = el.value.trim();
    if (has(v) && (isNaN(Number(v)) || Number(v) < 0 || Number(v) > 60)) { toast('Score Stableford entre 0 et 60.'); return; }
    safe(() => updateDoc(evRef(U.sel), { ['scores.' + k]: has(v) ? v : deleteField() }));
    return;
  }
  if (el.dataset.sk) {
    const [k, f] = el.dataset.sk.split('|'); const raw = String(el.value).trim();
    const ev = getEv(U.sel); if (!ev) return;
    const cur = ((ev.scores || {})[k] || {})[f] || '';
    if (raw === String(cur)) return;
    if (raw !== '' && (!/^\d+$/.test(raw) || Number(raw) > SKILL_SANE)) {
      toast('Entre un nombre entier de points.'); el.value = cur; return;
    }
    safe(() => updateDoc(evRef(U.sel), { ['scores.' + k + '.' + f]: raw === '' ? deleteField() : raw }));
    return;
  }
  if (el.dataset.file !== undefined) { readImportFile(el.files && el.files[0]); el.value = ''; return; }
  if (el.dataset.pb) {
    const [k, f] = el.dataset.pb.split('|'); const raw = String(el.value).trim();
    const ev = getEv(U.sel); if (!ev) return;
    const cur = ((ev.extra || {})[k] || {})[f] || '';
    if (raw === String(cur)) return;
    if (raw !== '' && (!/^\d+$/.test(raw) || Number(raw) > 18)) { toast('Entre un nombre entre 0 et 18'); el.value = cur; return; }
    safe(() => updateDoc(evRef(U.sel), { ['extra.' + k + '.' + f]: raw === '' ? deleteField() : raw }));
    return;
  }
  if (el.tagName === 'TEXTAREA' && el.dataset.rb) { setField(el); U.impFile = ''; U.impSheet = ''; render(); return; }
  if (el.tagName === 'INPUT' && el.dataset.rb) { setField(el); render(); return; }
  if (el.tagName === 'SELECT') setField(el);
});
['dragenter', 'dragover'].forEach(ev => root.addEventListener(ev, e => {
  if (!e.target.closest('[data-drop]')) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
  if (!U.impOver) { U.impOver = true; render(); }
}));
root.addEventListener('dragleave', e => {
  const z = e.target.closest('[data-drop]'); if (!z || z.contains(e.relatedTarget)) return;
  if (U.impOver) { U.impOver = false; render(); }
});
root.addEventListener('drop', e => {
  if (!e.target.closest('[data-drop]')) return;
  e.preventDefault(); U.impOver = false;
  readImportFile(e.dataTransfer.files && e.dataTransfer.files[0]);
});
/* Un fichier lache a cote de la zone ouvrirait le fichier dans l'onglet : on l'ignore. */
['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => {
  if (!e.target.closest || !e.target.closest('[data-drop]')) e.preventDefault();
}));

root.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('.auth') && e.target.tagName === 'INPUT') A.authGo(); });
render();
</script>
</body>
