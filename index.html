.center{text-align:center}

/* ===================== CONFIGURATION ===================== */
// Coller ici la configuration du projet Firebase (Console Firebase > Paramètres du projet > Vos applications > Config)
const firebaseConfig = {

const ADMINS = ["francisberlier@gmail.com"];

/* ========================================================= */

const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MOIS_C = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const JOURS = ['DIM','LUN','MAR','MER','JEU','VEN','SAM'];
const JOURS_LONG = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const TYPES = [

const M18 = ['1 up','2 up','2&1','3&1','3&2','4&2','4&3','5&3','5&4','6&4','6&5','7&5','7&6','8&6','8&7','9&7','9&8','10&8'];

  chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A84" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',

  team: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>',
  stats: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  admin: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',

};

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PWD_RE = /^(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{8,}$/;
const PWD_RULE = 'Au moins 8 caractères, dont 1 majuscule et 1 caractère spécial.';
const K = email => String(email || '').trim().toLowerCase().replace(/\./g, ',');
const typeOf = v => TYPES.find(t => t.v === v) || TYPES[1];
const isGolf = t => ['matchplay', 'interclub', 'course18', 'course9'].includes(t);
const isCourse = t => t === 'course18' || t === 'course9';
const isMPt = t => t === 'matchplay' || t === 'interclub';
const holesOf = e => isCourse(e.type) ? (e.type === 'course18' ? 18 : 9) : (e.holes || 18);
const pad = n => String(n).padStart(2, '0');
const isoToday = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dt = iso => new Date(iso + 'T12:00:00');
const shortDate = iso => { const d = dt(iso); return d.getDate() + ' ' + MOIS_C[d.getMonth()]; };
const longDate = iso => { const d = dt(iso); return JOURS_LONG[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()].toLowerCase() + ' ' + d.getFullYear(); };
const initials = n => String(n || '?').split(/[\s.\-]+/).filter(Boolean).map(p => p[0]).join('').slice(0, 2).toUpperCase();
const fmtN = x => (Math.round(x * 10) / 10).toFixed(1).replace('.', ',');
const fmtPts = x => { const w = Math.floor(x); return (x % 1 ? (w ? String(w) : '') + '½' : String(w)) + (x > 1 ? ' pts' : ' pt'); };
const half = x => { const w = Math.floor(x); return x % 1 ? (w ? String(w) : '') + '½' : String(w); };
const pct = (a, b) => b ? Math.round(100 * a / b) + ' %' : '—';
const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
const has = v => v !== undefined && v !== null && v !== '';
function typeText(e) {
  if (e.type === 'matchplay') return 'Match play ' + (e.format === 'foursome' ? 'foursome' : 'simple') + ' · ' + (e.holes || 18) + ' trous';
  if (isCourse(e.type)) return typeOf(e.type).l + ' · Stableford';
  if (e.type === 'interclub') return 'Interclub · ' + (e.home === false ? 'extérieur' : 'domicile') + ' · ' + (e.holes || 18) + ' trous';
  return typeOf(e.type).l;
}
function rankRows(list, better) {
  const out = list.slice().sort(better);
  out.forEach((r, i) => { r.pos = (i > 0 && better(out[i - 1], r) === 0) ? out[i - 1].pos : i + 1; });
  return out;
}

/* ---------- Firebase ---------- */
const configured = !!firebaseConfig.apiKey;
let auth, db;
if (configured) { const app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app); }

/* ---------- state ---------- */
const S = {
  user: null, loading: true, teams: [], teamId: localStorage.getItem('ic_team') || null, team: null, events: [],
  unsubTeams: null, unsubTeam: null, unsubEvents: null, pending: false,

};
const U = S.ui;
const me = () => S.user ? K(S.user.email) : '';
const isAdmin = () => !!S.user && ADMINS.map(e => e.toLowerCase()).includes(S.user.email.toLowerCase());
const isCapReal = () => !!S.team && (isAdmin() || (S.team.captains || []).includes(me()));
const capView = () => isCapReal() && U.roleView === 'cap';
const members = () => Object.entries((S.team && S.team.members) || {}).map(([k, m]) => ({ k, name: m.name || k, hcp: m.hcp || '', email: m.email || '' })).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
const nameOf = k => (S.team && S.team.members && S.team.members[k] && S.team.members[k].name) || (String(k).includes(',') ? String(k).replace(/,/g, '.') : k);
const names = arr => (Array.isArray(arr) ? arr.map(nameOf).join(' & ') : String(arr || ''));
const evRef = id => doc(db, 'teams', S.teamId, 'events', id);
const getEv = id => S.events.find(e => e.id === id);

function toast(msg) { U.toast = msg; render(); clearTimeout(S.tt); S.tt = setTimeout(() => { U.toast = ''; render(); }, 2200); }
async function safe(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) { console.error(e); toast('Erreur : ' + (e.code === 'permission-denied' ? 'action non autorisée' : (e.message || e))); }
}

/* ---------- auth & subscriptions ---------- */
if (configured) {
  onAuthStateChanged(auth, user => {
    S.user = user; S.loading = false;
    stopAll();
    if (user) subscribeTeams();
    render();
  });
} else { S.loading = false; }

function stopAll() {
  ['unsubTeams', 'unsubTeam', 'unsubEvents'].forEach(k => { if (S[k]) { S[k](); S[k] = null; } });
  S.teams = []; S.team = null; S.events = [];
}
function subscribeTeams() {
  const q = isAdmin() ? collection(db, 'teams') : query(collection(db, 'teams'), where('memberKeys', 'array-contains', me()));
  S.unsubTeams = onSnapshot(q, snap => {
    S.teams = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'fr'));
    if (!S.teams.find(t => t.id === S.teamId)) {
      const mine = S.teams.find(t => (t.memberKeys || []).includes(me()));
      S.teamId = mine ? mine.id : (S.teams.length ? S.teams[0].id : null);
    }
    subscribeTeam();
    softRender();
  }, err => { console.error(err); toast('Accès aux équipes refusé'); });
}
function subscribeTeam() {
  if (S.subscribedTo === S.teamId) return;
  if (S.unsubTeam) S.unsubTeam(); if (S.unsubEvents) S.unsubEvents();
  S.unsubTeam = S.unsubEvents = null; S.team = null; S.events = []; S.subscribedTo = S.teamId;
  if (!S.teamId) return;
  localStorage.setItem('ic_team', S.teamId);
  S.unsubTeam = onSnapshot(doc(db, 'teams', S.teamId), d => { S.team = d.exists() ? { id: d.id, ...d.data() } : null; softRender(); });
  S.unsubEvents = onSnapshot(collection(db, 'teams', S.teamId, 'events'), snap => {
    S.events = snap.docs.map(d => ({ id: d.id, r: {}, ...d.data() })); softRender();
  }, err => console.error(err));
}

/* ---------- stats ---------- */
function computeStats() {
  const S2 = {};
  members().forEach(p => { S2[p.k] = { mpS: { w: 0, h: 0, l: 0 }, mpF: { w: 0, h: 0, l: 0 }, pts: 0, n: 0, stab18: [], stab9: [], yes: 0, conv: 0, hist: [], mp: [], put: { putts: 0, holes: 0, rounds: 0, udOk: 0, udTry: 0, sOk: 0, sTry: 0 } }; });
  const sorted = S.events.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  sorted.forEach(ev => {
    const memberKeys = (S.team && S.team.memberKeys) || [];
    Object.keys(S2).forEach(k => {
      const inv = ev.free ? (ev.invited || []).includes(k) : memberKeys.includes(k);
      if (inv) { S2[k].conv++; if (ev.r && ev.r[k] === 'yes') S2[k].yes++; }
    });
    if (isMPt(ev.type)) {
      const parties = ev.parties || (ev.sideA ? [{ a: ev.sideA, b: ev.sideB }] : []);
      parties.forEach(pt => {
        if (!pt.outcome) return;
        const four = pt.four !== undefined ? pt.four : ev.format === 'foursome';
        const inv = pt.outcome === 'win' ? 'loss' : pt.outcome === 'loss' ? 'win' : 'half';
        const sides = [{ ks: pt.a || [], res: pt.outcome, opp: names(pt.b) }, { ks: Array.isArray(pt.b) ? pt.b : [], res: inv, opp: names(pt.a) }];
        sides.forEach(sd => sd.ks.forEach(k => {
          const x = S2[k]; if (!x) return;
          const rec = four ? x.mpF : x.mpS;
          rec[sd.res === 'win' ? 'w' : sd.res === 'loss' ? 'l' : 'h']++;
          x.pts += sd.res === 'win' ? 1 : sd.res === 'half' ? 0.5 : 0; x.n++;
          const partner = sd.ks.filter(m => m !== k).map(nameOf).join(' & ');
          x.mp.push({ date: ev.date, title: ev.title, four, holes: ev.holes || 18, opp: sd.opp, partner, res: sd.res, margin: pt.margin || '' });
          x.hist.push({ date: ev.date, title: ev.title, tag: (four ? 'Foursome' : 'Simple') + ' · vs ' + sd.opp, label: sd.res === 'win' ? 'Victoire ' + (pt.margin || '') : sd.res === 'loss' ? 'Défaite ' + (pt.margin || '') : 'Partagé', cls: sd.res });
        }));
      });
    }
    if (isCourse(ev.type)) {
      const h = holesOf(ev);
      Object.entries(ev.scores || {}).forEach(([k, v]) => {
        if (!has(v) || isNaN(Number(v)) || !S2[k]) return;
        S2[k][h === 18 ? 'stab18' : 'stab9'].push(Number(v)); S2[k].n++;
        S2[k].hist.push({ date: ev.date, title: ev.title, tag: 'Stableford · ' + h + ' trous', label: v + ' pts', cls: '' });
      });
      Object.entries(ev.extra || {}).forEach(([k, e]) => {
        const P = S2[k] && S2[k].put; if (!P || !e) return;
        if (has(e.putts)) { P.putts += Number(e.putts); P.holes += h; P.rounds++; }
        P.udOk += Number(e.udOk || 0); P.udTry += Number(e.udTry || 0); P.sOk += Number(e.sOk || 0); P.sTry += Number(e.sTry || 0);
      });
    }
  });
  return S2;
}

/* ---------- render infrastructure ---------- */
const root = document.getElementById('root');
let lastViewKey = '';
function isTyping() { const a = document.activeElement; return a && root.contains(a) && ['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName); }
function softRender() { if (isTyping()) { S.pending = true; return; } render(); }
root.addEventListener('focusout', () => setTimeout(() => { if (S.pending && !isTyping()) { S.pending = false; render(); } }, 50));

function render() {
  const sc = document.getElementById('scroll');
  const key = [U.tab, U.view, U.sel, U.selPlayer, U.statTab, U.agFilter, S.teamId].join('|');
  const keep = sc && key === lastViewKey ? sc.scrollTop : null;
  root.innerHTML = view();
  lastViewKey = key;
  const sc2 = document.getElementById('scroll');
  if (sc2 && keep !== null) sc2.scrollTop = keep;
  if (U.todayScroll && U.tab === 'agenda' && U.view === 'list') {
    const mark = document.getElementById('today-mark');
    if (sc2 && mark) { sc2.scrollTop = mark.offsetTop - sc2.offsetTop - 4; U.todayScroll = false; }
  }
}

function view() {
  if (!configured) return `<div class="auth"><div class="logo">Interclub</div><div class="card"><div class="t15">Configuration manquante</div><div class="small">Colle la configuration Firebase dans le fichier index.html (bloc CONFIGURATION), puis recharge la page.</div></div></div>`;
  if (S.loading) return `<div class="auth"><div class="logo">Interclub</div><div class="small">Chargement…</div></div>`;
  if (!S.user) return vAuth();
  let body = '';
  if (!S.teams.length && !isAdmin()) body = vNoTeam();
  else if (U.tab === 'admin') body = vAdmin();
  else if (!S.team) body = `<div class="top"><h1>Interclub</h1><div class="small">${S.teams.length ? 'Chargement de l’équipe…' : 'Aucune équipe. Crée-en une dans l’onglet Admin.'}</div></div>`;
  else if (U.view === 'detail' && getEv(U.sel)) body = vDetail(getEv(U.sel));
  else if (U.view === 'results' && getEv(U.sel)) body = vResults(getEv(U.sel));
  else if (U.view === 'add') body = vAdd();
  else if (U.view === 'player' && U.selPlayer) body = vFiche(U.selPlayer, true);
  else if (U.view === 'matches' && U.selPlayer) body = vMatches(U.selPlayer);
  else if (U.tab === 'squad') body = vSquad();
  else if (U.tab === 'stats') body = capView() ? vStats() : vFiche(me(), false);
  else body = vAgenda();
  return body + vNav() + (U.toast ? `<div class="toast" role="status">${esc(U.toast)}</div>` : '');
}

/* ---------- header & nav ---------- */
function vHeader(title, plusAction, plusLabel) {
  const teamSel = S.teams.length > 1
    ? `<select class="in" style="height:40px;font-size:14px;font-weight:700;width:auto;max-width:100%" data-f="teamPick" data-r="1" aria-label="Équipe">${S.teams.map(t => `<option value="${esc(t.id)}" ${t.id === S.teamId ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>`
    : `<div class="sub">${esc(S.team ? S.team.name : '')}${S.team && S.team.season ? ' · ' + esc(S.team.season) : ''}</div>`;
  return `<div class="top">

function vNav() {
  const items = [['agenda', 'Agenda', ICON.cal], ['squad', 'Effectif', ICON.team], ['stats', 'Stats', ICON.stats]];

  if (!S.team && !isAdmin()) return '';
  return `<nav class="bot" style="grid-template-columns:repeat(${items.length},1fr)">${items.map(([k, l, i]) => `<button class="${U.tab === k ? 'on' : ''}" data-a="tab" data-v="${k}" ${U.tab === k ? 'aria-current="page"' : ''}>${i}${l}</button>`).join('')}</nav>`;
}

/* ---------- agenda ---------- */
function vAgenda() {
  const today = isoToday(), mk = me(), cap = capView();
  const nMembers = members().length;
  const evs = S.events.filter(e => {
    if (e.free && !cap && !(e.invited || []).includes(mk)) return false;
    if (U.agFilter !== 'all' && !FMAP[U.agFilter].includes(e.type)) return false;
    return true;
  }).sort((a, b) => ((a.date || '') + (a.time || '')).localeCompare((b.date || '') + (b.time || '')));
  const past = [], fut = [];
  evs.forEach(e => {
    const bucket = e.date < today ? past : fut;
    const d = dt(e.date), key = MOIS[d.getMonth()] + ' ' + d.getFullYear();
    let g = bucket[bucket.length - 1]; if (!g || g.month !== key) { g = { month: key, items: [] }; bucket.push(g); }
    g.items.push(e);
  });
  const item = e => {
    const d = dt(e.date); const r = e.r || {};
    const yes = Object.values(r).filter(v => v === 'yes').length;
    const mine = r[mk] || 'none';
    const right = cap ? `<span class="pill">${yes} / ${e.free ? (e.invited || []).length : nMembers}</span>` : `<span class="pill ${mine}">${ST[mine]}</span>`;
    return `<button class="ev" data-a="open" data-v="${esc(e.id)}">
    <span class="tile" style="background:${typeOf(e.type).color}"><b>${d.getDate()}</b><span>${JOURS[d.getDay()]}</span></span>
    <span class="grow"><span class="t15 ell">${esc(e.title)}</span><span class="small ell">${e.free ? 'Partie libre · ' : ''}${esc(typeText(e))}${e.time ? ' · ' + esc(e.time) : ''}</span></span>${right}</button>`;
  };
  const groups = gs => gs.map(g => `<div class="month">${g.month}</div>${g.items.map(item).join('')}`).join('');
  const now = new Date();
  return vHeader('Agenda', 'openAdd', cap ? 'Ajouter un événement' : 'Organiser une partie')
    + `<div class="chips">${FILTERS.map(f => `<button class="chip ${U.agFilter === f.k ? 'on' : ''}" data-a="filter" data-v="${f.k}">${f.l}</button>`).join('')}</div>
    <div class="scroll" id="scroll" style="gap:8px">
    ${!evs.length ? `<div class="small center" style="padding:24px">Aucun événement${U.agFilter !== 'all' ? ' de ce type' : ''}.</div>` : ''}
    ${groups(past)}
    <div class="today" id="today-mark"><span>Aujourd’hui · ${JOURS_LONG[now.getDay()]} ${now.getDate()} ${MOIS[now.getMonth()].toLowerCase()}</span><i></i></div>
    ${fut.length ? groups(fut) : (evs.length ? '<div class="small" style="padding:8px 4px">Rien de prévu à venir.</div>' : '')}
    </div>`;
}

/* ---------- detail ---------- */
function vDetail(ev) {
  const mk = me(), cap = capView(), t = typeOf(ev.type), r = ev.r || {};
  const pool = ev.free ? (ev.invited || []) : ((S.team.memberKeys) || []);
  const concerned = pool.includes(mk);
  const my = r[mk];
  let yes = 0, no = 0;
  const rows = pool.map(k => { const v = r[k] || 'none'; if (v === 'yes') yes++; if (v === 'no') no++; return { k, v, o: v === 'yes' ? 0 : v === 'none' ? 1 : 2 }; })
    .sort((a, b) => a.o - b.o || nameOf(a.k).localeCompare(nameOf(b.k), 'fr'));
  const canSet = cap && !ev.free;
  const canDelete = ev.free ? ev.org === mk : cap;
  let resSummary = '';
  if (isMPt(ev.type)) {
    const P = ev.parties || (ev.sideA ? [{ a: ev.sideA, b: ev.sideB }] : []);
    resSummary = P.length ? P.filter(p => p.outcome).length + ' / ' + P.length + ' parties saisies' : 'Aucune partie';
  } else if (isCourse(ev.type)) {
    const ys = pool.filter(k => r[k] === 'yes');
    resSummary = ys.length ? ys.filter(k => has((ev.scores || {})[k])).length + ' / ' + ys.length + ' scores saisis' : 'Aucun joueur confirmé';
  }
  return `<div class="top"><div><button class="back" data-a="backList">${ICON.back}Agenda</button></div></div>
  <div class="scroll" id="scroll" style="gap:18px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="badge" style="background:${t.color}">${esc(typeText(ev))}</span>
    <h2>${esc(ev.title)}</h2>
    <div class="sub" style="font-weight:500">${longDate(ev.date)}${ev.time ? ' · ' + esc(ev.time) : ''}</div>
    ${ev.place ? `<div class="sub" style="font-weight:500">${esc(ev.place)}</div>` : ''}
    ${ev.free ? `<div style="font-size:13px;font-weight:700;color:var(--or)">Partie libre · organisée par ${esc(nameOf(ev.org))}</div>` : ''}
    ${ev.notes ? `<div class="small">${esc(ev.notes)}</div>` : ''}
  </div>
  ${ev.free && ev.sideA ? `<div class="card vs"><div class="t14 center">${ev.sideA.map(k => esc(nameOf(k))).join('<br>')}</div><div class="small" style="font-weight:800">VS</div><div class="t14 center">${ev.sideB.map(k => esc(nameOf(k))).join('<br>')}</div></div>` : ''}
  ${concerned ? `<div class="card"><div class="t14">Ta participation</div><div class="flex">
    <button class="btn ${my === 'yes' ? 'sel' : ''}" data-a="setMine" data-v="yes">Je participe</button>
    <button class="btn ${my === 'no' ? 'selno' : ''}" data-a="setMine" data-v="no">Absent</button></div></div>` : ''}
  ${isGolf(ev.type) ? `<button class="ev" data-a="openResults" style="padding:14px 16px;border-radius:18px">
    <span style="width:40px;height:40px;flex-shrink:0;border-radius:12px;background:var(--gl);color:var(--gd);display:flex;align-items:center;justify-content:center">${ICON.trophy}</span>
    <span class="grow"><span class="t15" style="font-weight:800">Résultats</span><span class="small">${esc(resSummary)}</span></span>${ICON.chev}</button>` : ''}
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="toprow"><div style="font-size:16px;font-weight:800">Réponses</div><div class="small">${yes} présents · ${no} absents · ${pool.length - yes - no} sans réponse</div></div>
    ${canSet ? '<div class="small">Capitaine : touche le statut d’un joueur pour le changer (À répondre → Présent → Absent).</div>' : ''}
    <div class="list">${rows.map(x => `<div class="li"><div class="av">${esc(initials(nameOf(x.k)))}</div><div class="grow t14" style="font-weight:600">${esc(nameOf(x.k))}${x.k === mk ? ' (toi)' : ''}</div>
      ${canSet ? `<button class="pill ${x.v} click" data-a="cycle" data-v="${esc(x.k)}" aria-label="Changer la présence de ${esc(nameOf(x.k))}">${ST[x.v]}</button>` : `<span class="pill ${x.v}">${ST[x.v]}</span>`}</div>`).join('') || '<div class="li small">Aucun joueur.</div>'}</div>
  </div>
  ${canDelete ? (U.confirmDel ? `<div class="card" style="background:var(--redl);border-color:#E8C9C3"><div class="t14" style="color:var(--red)">Supprimer définitivement ?</div><div class="flex"><button class="btn" data-a="confirmDel" data-v="0">Annuler</button><button class="btn" style="background:var(--red);border-color:var(--red);color:#fff" data-a="doDelete">Supprimer</button></div></div>`
    : `<button class="btn danger" data-a="confirmDel" data-v="1">${ev.free ? 'Supprimer la partie' : 'Supprimer l’événement'}</button>`)
    : (ev.free && cap ? '<div class="small center">Seul l’organisateur peut supprimer cette partie.</div>' : '')}
  </div>`;
}

/* ---------- results ---------- */
function vResults(ev) {
  const mk = me(), cap = capView(), isIC = ev.type === 'interclub';
  let html = `<div class="top"><div><button class="back" data-a="backDetail">${ICON.back}Événement</button></div>
  <div style="display:flex;flex-direction:column;gap:4px"><h2>Résultats</h2><div class="t14">${esc(ev.title)}</div><div class="small">${esc(typeText(ev))} · ${longDate(ev.date)}</div></div></div>
  <div class="scroll" id="scroll" style="gap:14px">`;
  if (isMPt(ev.type)) {
    const P = ev.parties || (ev.sideA ? [{ a: ev.sideA, b: ev.sideB }] : []);
    const canRes = ev.free ? (ev.invited || []).includes(mk) : cap;
    let won = 0, lost = 0, any = false;
    const cards = P.map((pt, i) => {
      const aT = names(pt.a), bT = names(pt.b); let txt, cls;
      if (pt.outcome === 'win') { txt = aT + ' gagne · ' + pt.margin; cls = 'win'; won++; any = true; }
      else if (pt.outcome === 'loss') { txt = bT + ' gagne · ' + pt.margin; cls = 'loss'; lost++; any = true; }
      else if (pt.outcome === 'half') { txt = 'Partagé (AS)'; cls = ''; won += .5; lost += .5; any = true; }
      else { txt = 'Résultat à saisir'; cls = 'none'; }
      const four = pt.four !== undefined ? pt.four : ev.format === 'foursome';
      return `<div class="card" style="padding:12px 14px;gap:10px">
      ${isIC ? `<div style="display:flex;align-items:center;gap:8px"><span class="order">Départ n°${i + 1}</span><span class="small" style="flex:1;font-weight:700">${four ? 'Foursome' : 'Simple'}</span>
        ${cap ? `<button class="mini" data-a="move" data-v="${i}:-1" aria-label="Monter">${ICON.up}</button><button class="mini" data-a="move" data-v="${i}:1" aria-label="Descendre">${ICON.down}</button>` : ''}</div>` : ''}
      <div class="vs"><div class="t14" style="font-size:13px">${esc(aT)}</div><div class="small" style="font-weight:800">VS</div><div class="t14" style="font-size:13px;text-align:right">${esc(bT)}</div></div>
      <div class="toprow" style="flex-wrap:wrap"><span class="pill ${cls}" style="max-width:100%">${esc(txt)}</span>
      ${canRes ? `<span style="display:flex;gap:6px;margin-left:auto">${cap && !ev.free ? `<button class="edit" style="color:var(--red)" data-a="delParty" data-v="${i}" aria-label="Retirer cette partie">Retirer</button>` : ''}<button class="edit" data-a="editParty" data-v="${i}">${pt.outcome ? 'Modifier' : 'Saisir'}</button></span>` : ''}</div></div>`;

      <button class="btn left ${U.pOut === 'half' ? 'sel' : ''}" data-a="pOut" data-v="half">Partagé (all square)</button>
      <button class="btn left ${U.pOut === 'loss' ? 'sel' : ''}" data-a="pOut" data-v="loss">${esc(names(ep.b))} gagne</button>
      ${U.pOut !== 'half' ? `<label class="f">Écart<select class="in" data-f="pMargin">${M.map(m => `<option ${m === U.pMargin ? 'selected' : ''}>${m}</option>`).join('')}</select></label>` : ''}

        const four = isIC ? !!U.npFour : ev.format === 'foursome';

    const pool = ev.free ? (ev.invited || []) : (S.team.memberKeys || []);
    const ys = pool.filter(k => (ev.r || {})[k] === 'yes');

    html += `<div class="toprow"><div style="font-size:16px;font-weight:800">Classement</div><div class="small" style="font-weight:700">Stableford · points</div></div>
    <div class="list">${ys.map(k => {
      const v = sc[k], hv = has(v); const pos = hv ? 1 + vals.filter(x => x > Number(v)).length : '';
      const editable = cap || k === mk; const e = ex[k];
      const exText = e ? `Putts ${e.putts || '—'} · App. ${e.udOk || 0}/${e.udTry || 0} · Sandy ${e.sOk || 0}/${e.sTry || 0}` : (editable ? '+ putts, approche-put, sandy' : '');
      return `<div class="li" style="padding:8px 14px"><div class="pos ${pos === 1 ? 'first' : ''}">${pos}</div>
      ${editable ? `<button class="grow" style="border:none;background:none;text-align:left;padding:4px 0" data-a="openExtra" data-v="${esc(k)}"><span class="t14" style="font-weight:600">${esc(nameOf(k))}</span><span style="font-size:11px;font-weight:600;color:var(--g)">${esc(exText)}</span></button>
        <input class="in num" type="number" inputmode="numeric" min="0" max="60" data-score="${esc(k)}" value="${hv ? esc(v) : ''}" aria-label="Points Stableford de ${esc(nameOf(k))}">`
        : `<div class="grow"><span class="t14" style="font-weight:600">${esc(nameOf(k))}</span><span class="small" style="font-size:11px">${esc(exText)}</span></div><div class="t15" style="width:72px;text-align:center">${hv ? esc(v) : '—'}</div>`}
      <div class="small" style="width:24px">pts</div></div>`;
    }).join('') || '<div class="li small">Aucun joueur n’a confirmé sa participation.</div>'}</div>`;
    if (U.xEdit && ys.includes(U.xEdit)) {
      const num = (l, f) => `<label class="f" style="font-size:12px">${l}<input class="in" type="number" inputmode="numeric" min="0" data-f="${f}" value="${esc(U[f])}" style="text-align:center;font-weight:700"></label>`;
      html += `<div class="panel"><div class="t14" style="font-weight:800">Petit jeu · ${esc(nameOf(U.xEdit))}</div>
      ${num('Nombre de putts (total)', 'xPutts')}
      <div class="small">Approche-put : approche + 1 putt pour sauver le par (ou mieux). Sandy : sortie de bunker + 1 putt.</div>
      <div class="row2">${num('Approche-put réussis', 'xUdOk')}${num('Approche-put tentés', 'xUdTry')}${num('Sandy réussis', 'xSOk')}${num('Sandy tentés', 'xSTry')}</div>
      ${U.xErr ? `<div class="err">${esc(U.xErr)}</div>` : ''}
      <div class="flex"><button class="btn" data-a="cancelExtra">Annuler</button><button class="btn primary" data-a="saveExtra">Valider</button></div></div>`;
    }
    html += `<div class="small">${cap ? 'Le capitaine peut saisir tous les scores ; chaque joueur saisit le sien.' : 'Tu saisis ton score ; le classement se met à jour.'} Le score est enregistré dès que tu quittes la case.</div>`;
  }
  return html + '</div>';
}

/* ---------- stats ---------- */
function vStats() {
  const St = computeStats(), M = members();
  const rec = r => r.w + '-' + r.h + '-' + r.l;
  const row = (r, act, v) => `<button class="li" data-a="${act}" data-v="${esc(r.k)}"><span class="pos ${r.pos === 1 ? 'first' : ''}">${r.pos}</span><span class="grow"><span class="t14">${esc(r.name)}</span><span class="small">${esc(r.sub)}</span></span><span class="t15" style="font-weight:800">${esc(r.value)}</span></button>`;
  let html = vHeader('Statistiques') + `<div class="scroll" id="scroll"><div class="tabs" style="grid-template-columns:repeat(4,1fr)">
  ${[['mp', 'Match play'], ['score', 'Stableford'], ['put', 'Putting'], ['pres', 'Présences']].map(([k, l]) => `<button class="tab ${U.statTab === k ? 'on' : ''}" data-a="statTab" data-v="${k}" style="font-size:11px">${l}</button>`).join('')}</div>`;
  if (U.statTab === 'mp') {
    const rows = rankRows(M.filter(p => St[p.k].mp.length).map(p => { const x = St[p.k]; return { k: p.k, name: p.name, pts: x.pts, sub: 'Simple ' + rec(x.mpS) + ' · Foursome ' + rec(x.mpF), value: fmtPts(x.pts) }; }), (a, b) => b.pts - a.pts);
    html += `<div class="small">Simple et foursome · victoire 1 pt, partagé ½ · V-N-D = victoires, nuls, défaites. Touche un joueur pour voir ses matchs.</div><div class="list">${rows.map(r => row(r, 'openMatches')).join('') || '<div class="li small">Aucun match play saisi.</div>'}</div>`;
  } else if (U.statTab === 'score') {
    [['stab18', 'Stableford 18 trous'], ['stab9', 'Stableford 9 trous']].forEach(([k, t]) => {
      const rows = rankRows(M.filter(p => St[p.k][k].length).map(p => { const a = St[p.k][k], m = avg(a); return { k: p.k, name: p.name, m, sub: a.length + (a.length > 1 ? ' parties' : ' partie') + ' · meilleur ' + Math.max(...a), value: fmtN(m) }; }), (a, b) => b.m - a.m);
      if (rows.length) html += `<div class="toprow" style="padding:0 4px"><div class="t14" style="font-weight:800">${t}</div><div class="small">moyenne en points</div></div><div class="list">${rows.map(r => row(r, 'openPlayer')).join('')}</div>`;
    });
    if (!M.some(p => St[p.k].stab18.length || St[p.k].stab9.length)) html += '<div class="small center" style="padding:20px">Aucun score Stableford saisi.</div>';
  } else if (U.statTab === 'put') {
    const rows = rankRows(M.filter(p => { const P = St[p.k].put; return P.holes || P.udTry || P.sTry; }).map(p => {
      const P = St[p.k].put, ppt = P.holes ? P.putts / P.holes : 99;
      return { k: p.k, name: p.name, ppt, sub: 'App.-put ' + P.udOk + '/' + P.udTry + ' (' + pct(P.udOk, P.udTry) + ') · Sandy ' + P.sOk + '/' + P.sTry + ' (' + pct(P.sOk, P.sTry) + ')', value: P.holes ? ppt.toFixed(2).replace('.', ',') + '/t' : '—' };
    }), (a, b) => a.ppt - b.ppt);
    html += `<div class="small">Classés par putts par trou (9 et 18 trous comparables) · approche-put et sandy en % de réussite</div><div class="list">${rows.map(r => row(r, 'openPlayer')).join('') || '<div class="li small">Aucune donnée de putting.</div>'}</div>`;
  } else {
    const rows = rankRows(M.map(p => { const x = St[p.k], pc = x.conv ? Math.round(100 * x.yes / x.conv) : 0; return { k: p.k, name: p.name, pc, sub: x.yes + ' / ' + x.conv + ' événements', value: pc + ' %' }; }), (a, b) => b.pc - a.pc);
    html += `<div class="small">Présences confirmées sur les événements où le joueur est convoqué ou invité</div><div class="list">${rows.map(r => row(r, 'openPlayer')).join('')}</div>`;
  }
  return html + '</div>';
}
function vFiche(k, withBack) {
  const St = computeStats(), X = St[k];
  const p = members().find(m => m.k === k);
  if (!X) return vHeader('Mes stats') + `<div class="scroll" id="scroll"><div class="small">Tu ne fais pas partie de l’effectif de cette équipe.</div></div>`;
  const rec = r => r.w + '-' + r.h + '-' + r.l, PP = X.put;
  const tiles = [
    { l: 'Match play simple', v: rec(X.mpS), s: 'V-N-D · voir les matchs', a: 'single' },
    { l: 'Foursome', v: rec(X.mpF), s: 'V-N-D · voir les matchs', a: 'foursome' },
    { l: 'Points match play', v: fmtPts(X.pts), s: 'victoire 1 · partagé ½' },
    { l: 'Présences', v: (X.conv ? Math.round(100 * X.yes / X.conv) : 0) + ' %', s: X.yes + ' / ' + X.conv + ' événements' },
    { l: 'Stableford 18 trous', v: X.stab18.length ? fmtN(avg(X.stab18)) : '—', s: X.stab18.length ? 'moyenne · ' + X.stab18.length + ' partie(s)' : 'aucun score' }
  ];
  if (X.stab9.length) tiles.push({ l: 'Stableford 9 trous', v: fmtN(avg(X.stab9)), s: 'moyenne · ' + X.stab9.length + ' partie(s)' });
  tiles.push({ l: 'Putts par trou', v: PP.holes ? (PP.putts / PP.holes).toFixed(2).replace('.', ',') : '—', s: PP.rounds ? 'sur ' + PP.rounds + ' parcours' : 'aucune donnée' });
  tiles.push({ l: 'Approche-put', v: pct(PP.udOk, PP.udTry), s: PP.udOk + ' / ' + PP.udTry + ' réussis' });
  tiles.push({ l: 'Sandy', v: pct(PP.sOk, PP.sTry), s: PP.sOk + ' / ' + PP.sTry + ' réussis' });
  const name = p ? p.name : nameOf(k);
  const top = withBack ? `<div class="top"><div><button class="back" data-a="backList">${ICON.back}Statistiques</button></div></div>` : vHeader('Mes stats');
  return top + `<div class="scroll" id="scroll" style="gap:14px">
  <div class="card" style="flex-direction:row;align-items:center;gap:14px"><div class="av" style="width:52px;height:52px;border-radius:26px;background:var(--gl);color:var(--gd);font-size:17px;font-weight:800">${esc(initials(name))}</div>
  <div><div style="font-size:19px;font-weight:800">${esc(name)}</div><div class="small">HCP ${esc(p && p.hcp ? p.hcp : '—')} · ${X.n} résultats</div></div></div>
  <div class="grid2">${tiles.map(t => t.a ? `<button class="stat" data-a="ficheMatches" data-v="${esc(k)}:${t.a}"><span class="l">${t.l} ›</span><span class="v">${esc(t.v)}</span><span class="small" style="font-size:11px">${esc(t.s)}</span></button>`
    : `<div class="stat"><div class="l">${t.l}</div><div class="v">${esc(t.v)}</div><div class="small" style="font-size:11px">${esc(t.s)}</div></div>`).join('')}</div>
  <div style="font-size:16px;font-weight:800;padding:4px 4px 0">Historique</div>
  <div class="list">${X.hist.slice().reverse().map(h => `<div class="li"><div class="small" style="width:46px;flex-shrink:0;font-weight:700">${shortDate(h.date)}</div><div class="grow"><span class="t14 ell" style="font-size:13px">${esc(h.title)}</span><span class="small" style="font-size:11px">${esc(h.tag)}</span></div><span class="pill ${h.cls}">${esc(h.label)}</span></div>`).join('') || '<div class="li small">Aucun résultat pour l’instant.</div>'}</div>
  </div>`;
}

    <div class="list">${caps.map(k => `<div class="li"><div class="grow"><span class="t14">${esc((t.members && t.members[k] && t.members[k].name) || k)}</span><span class="small">${esc(String(k).replace(/,/g, '.'))}</span></div><button class="edit" style="color:var(--red)" data-a="removeCaptain" data-v="${esc(t.id)}|${esc(k)}">Retirer</button></div>`).join('') || '<div class="li small">Aucun capitaine.</div>'}</div>
    ${U.capTeam === t.id ? `<div class="panel"><label class="f">Nom du capitaine<input class="in" data-f="cName" value="${esc(U.cName)}"></label><label class="f">E-mail<input class="in" type="email" data-f="cEmail" value="${esc(U.cEmail)}"></label>
      ${U.cErr ? `<div class="err">${esc(U.cErr)}</div>` : ''}<div class="flex"><button class="btn" data-a="capTeam" data-v="">Annuler</button><button class="btn primary" data-a="addCaptain" data-v="${esc(t.id)}">Ajouter</button></div></div>`
      : `<button class="btn dashed" data-a="capTeam" data-v="${esc(t.id)}">+ Ajouter un capitaine</button>`}
    ${U.delTeam === t.id ? `<div class="flex"><button class="btn" data-a="delTeam" data-v="">Annuler</button><button class="btn" style="background:var(--red);border-color:var(--red);color:#fff" data-a="doDelTeam" data-v="${esc(t.id)}">Confirmer la suppression</button></div>`
      : `<button class="btn danger" data-a="delTeam" data-v="${esc(t.id)}">Supprimer l’équipe</button>`}
    </div>`;
  });
  return html + `<button class="link center" data-a="logout">Se déconnecter (${esc(S.user.email)})</button><div class="small center">${VERSION}</div></div>`;
}

/* ---------- actions ---------- */
function resetForm() {
  U.f = { type: capView() ? 'interclub' : 'matchplay', format: 'single', holes: 18, home: true, club: '', title: '', date: '', time: '', place: '', notes: '', opp1: '', opp2: '', partner: '', guests: [] };
  U.fErr = '';
}
const A = {
  authMode: v => { U.authMode = v; U.aErr = U.aOk = ''; render(); },
  authGo: async () => {
    U.aErr = U.aOk = '';
    const email = (U.aEmail || '').trim(), pwd = U.aPwd || '';
    try {
      if (U.authMode === 'reset') { if (!email) throw { code: 'x', message: 'Indique ton e-mail.' }; await sendPasswordResetEmail(auth, email); U.aOk = 'Lien envoyé. Regarde ta boîte mail.'; }
      else if (U.authMode === 'signup') {
        if (!(U.aName || '').trim()) throw { code: 'x', message: 'Indique ton prénom et ton nom.' };
        if (!PWD_RE.test(pwd)) throw { code: 'x', message: 'Mot de passe : ' + PWD_RULE };
        const c = await createUserWithEmailAndPassword(auth, email, pwd);
        await updateProfile(c.user, { displayName: U.aName.trim() });
      } else await signInWithEmailAndPassword(auth, email, pwd);
    } catch (e) {
      const m = { 'auth/invalid-email': 'Adresse e-mail invalide.', 'auth/missing-password': 'Indique un mot de passe.', 'auth/weak-password': 'Mot de passe : ' + PWD_RULE, 'auth/password-does-not-meet-requirements': 'Mot de passe : ' + PWD_RULE, 'auth/email-already-in-use': 'Un compte existe déjà avec cette adresse. Connecte-toi.', 'auth/invalid-credential': 'E-mail ou mot de passe incorrect.', 'auth/wrong-password': 'E-mail ou mot de passe incorrect.', 'auth/user-not-found': 'Aucun compte avec cette adresse.', 'auth/too-many-requests': 'Trop d’essais. Réessaie dans quelques minutes.' };
      U.aErr = m[e.code] || e.message || String(e);
    }
    render();
  },
  logout: () => { stopAll(); S.subscribedTo = null; signOut(auth); },
  tab: v => { U.tab = v; U.view = 'list'; U.sel = null; U.selPlayer = null; U.mEdit = null; if (v === 'agenda') U.todayScroll = true; render(); },
  role: v => { U.roleView = v; U.view = 'list'; U.todayScroll = true; render(); },
  filter: v => { U.agFilter = v; U.todayScroll = true; render(); },
  open: v => { U.view = 'detail'; U.sel = v; U.confirmDel = false; render(); },
  backList: () => { U.view = 'list'; U.sel = null; U.selPlayer = null; render(); },
  backDetail: () => { U.view = 'detail'; U.pEdit = null; U.addParty = false; U.xEdit = null; render(); },
  openResults: () => { U.view = 'results'; U.pEdit = null; U.addParty = false; U.xEdit = null; render(); },
  openAdd: () => { resetForm(); U.view = 'add'; render(); },
  setMine: v => { const k = me(); safe(() => updateDoc(evRef(U.sel), { ['r.' + k]: v })); },
  cycle: k => { const ev = getEv(U.sel); const v = (ev.r || {})[k] || 'none'; const n = v === 'none' ? 'yes' : v === 'yes' ? 'no' : 'none'; safe(() => updateDoc(evRef(U.sel), { ['r.' + k]: n === 'none' ? deleteField() : n })); },
  confirmDel: v => { U.confirmDel = v === '1'; render(); },
  doDelete: () => { const id = U.sel; U.view = 'list'; U.sel = null; U.confirmDel = false; render(); safe(() => deleteDoc(evRef(id)), 'Événement supprimé'); },
  fset: v => { const [k, x] = v.split(':'); U.f[k] = k === 'home' ? x === '1' : k === 'holes' ? Number(x) : x; render(); },
  guest: k => { const g = U.f.guests || []; const i = g.indexOf(k); if (i >= 0) g.splice(i, 1); else if (g.length < 3) g.push(k); U.f.guests = g; render(); },
  saveEvent: () => {
    const f = U.f, cap = capView(), mk = me();
    const err = m => { U.fErr = m; render(); };
    if (!f.date) return err('La date est obligatoire.');
    const ev = { type: f.type, title: (f.title || '').trim(), date: f.date, time: f.time || '', place: (f.place || '').trim(), r: {}, createdBy: mk, createdAt: Date.now() };
    if (f.notes) ev.notes = f.notes.trim();
    if (f.type === 'matchplay') { ev.format = f.format || 'single'; ev.holes = f.holes || 18; }
    if (isCourse(f.type)) ev.scoring = 'stableford';
    if (cap) {
      if (f.type === 'interclub') {
        const club = (f.club || '').trim(); if (!club) return err('Indique le club adverse.');
        Object.assign(ev, { club, home: f.home !== false, holes: f.holes || 18, format: 'mixed' });
        if (!ev.place) ev.place = ev.home ? 'Domicile' : 'Extérieur · ' + club;
        if (!ev.title) ev.title = 'VS ' + club;
      }
      if (!ev.title) return err('Indique un intitulé.');
    } else {
      Object.assign(ev, { free: true, org: mk }); ev.r[mk] = 'yes';
      if (f.type === 'matchplay' && ev.format === 'single') { if (!f.opp1) return err('Choisis ton adversaire.'); ev.sideA = [mk]; ev.sideB = [f.opp1]; }
      else if (f.type === 'matchplay') {
        const four = [f.partner, f.opp1, f.opp2];
        if (four.includes('')) return err('Choisis ton partenaire et les 2 adversaires.');
        if (new Set(four).size < 3) return err('Un même joueur est choisi deux fois.');
        ev.sideA = [mk, f.partner]; ev.sideB = [f.opp1, f.opp2];
      } else if (!(f.guests || []).length) return err('Invite au moins 1 joueur.');
      ev.invited = ev.sideA ? ev.sideA.concat(ev.sideB) : [mk].concat(f.guests);
      if (!ev.title) ev.title = ev.sideA ? names(ev.sideA) + ' vs ' + names(ev.sideB) : typeOf(f.type).l + ' entre amis';
    }
    U.view = 'list'; U.todayScroll = true; render();
    safe(() => addDoc(collection(db, 'teams', S.teamId, 'events'), ev), 'Événement créé');
  },
  /* results: match play */
  editParty: i => { const ev = getEv(U.sel); const P = ev.parties || (ev.sideA ? [{ a: ev.sideA, b: ev.sideB }] : []); const p = P[Number(i)]; U.pEdit = Number(i); U.pOut = p.outcome || 'win'; U.pMargin = p.margin || '1 up'; U.addParty = false; render(); },
  pOut: v => { U.pOut = v; render(); },
  cancelParty: () => { U.pEdit = null; render(); },
  saveResult: () => {
    const ev = getEv(U.sel); const P = (ev.parties || (ev.sideA ? [{ a: ev.sideA, b: ev.sideB }] : [])).map(x => ({ ...x }));
    P[U.pEdit] = { ...P[U.pEdit], outcome: U.pOut, margin: U.pOut === 'half' ? '' : U.pMargin };
    U.pEdit = null; render();
    safe(() => updateDoc(evRef(ev.id), { parties: P }), 'Résultat enregistré');
  },
  openAddParty: () => { U.addParty = true; U.npA1 = U.npA2 = U.npB = ''; U.npFour = false; U.partyErr = ''; render(); },
  closeAddParty: () => { U.addParty = false; render(); },
  npFour: v => { U.npFour = v === '1'; render(); },
  saveParty: () => {
    const ev = getEv(U.sel), isIC = ev.type === 'interclub';
    const four = isIC ? !!U.npFour : ev.format === 'foursome';
    const a = [U.npA1 || '']; if (four) a.push(U.npA2 || '');
    const err = m => { U.partyErr = m; render(); };
    if (a.includes('') || (!isIC && !(U.npB || '').trim())) return err(isIC ? 'Choisis le(s) joueur(s).' : 'Choisis le(s) joueur(s) et indique l’adversaire.');
    if (a.length === 2 && a[0] === a[1]) return err('Le même joueur est choisi deux fois.');
    const used = (ev.parties || []).flatMap(q => q.a || []);
    if (isIC && a.some(k => used.includes(k))) return err('Ce joueur a déjà un départ dans cette rencontre.');
    const b = isIC ? ev.club + ((U.npB || '').trim() ? ' · ' + U.npB.trim() : '') : U.npB.trim();
    const np = { a, b }; if (isIC) np.four = four;
    U.addParty = false; render();
    safe(() => updateDoc(evRef(ev.id), { parties: (ev.parties || []).concat([np]) }));
  },
  delParty: i => { const ev = getEv(U.sel); const P = (ev.parties || []).slice(); P.splice(Number(i), 1); safe(() => updateDoc(evRef(ev.id), { parties: P })); },
  move: v => {
    const [i, d] = v.split(':').map(Number); const ev = getEv(U.sel); const P = (ev.parties || []).slice(); const j = i + d;
    if (j < 0 || j >= P.length) return; [P[i], P[j]] = [P[j], P[i]];
    safe(() => updateDoc(evRef(ev.id), { parties: P }));
  },
  /* results: course */
  openExtra: k => { const e = (getEv(U.sel).extra || {})[k] || {}; U.xEdit = k; U.xErr = ''; ['putts', 'udOk', 'udTry', 'sOk', 'sTry'].forEach(f => U['x' + f[0].toUpperCase() + f.slice(1)] = e[f] || ''); render(); },
  cancelExtra: () => { U.xEdit = null; render(); },
  saveExtra: () => {
    const ev = getEv(U.sel), h = holesOf(ev);
    if (Number(U.xUdOk || 0) > Number(U.xUdTry || 0) || Number(U.xSOk || 0) > Number(U.xSTry || 0)) { U.xErr = 'Les réussis ne peuvent pas dépasser les tentés.'; return render(); }
    if (has(U.xPutts) && (Number(U.xPutts) < h * 0.5 || Number(U.xPutts) > h * 5)) { U.xErr = 'Nombre de putts peu plausible pour ' + h + ' trous.'; return render(); }
    const k = U.xEdit; U.xEdit = null; render();
    safe(() => updateDoc(evRef(ev.id), { ['extra.' + k]: { putts: U.xPutts || '', udOk: U.xUdOk || '', udTry: U.xUdTry || '', sOk: U.xSOk || '', sTry: U.xSTry || '' } }), 'Enregistré');
  },
  /* stats */
  statTab: v => { U.statTab = v; render(); },
  openPlayer: k => { U.view = 'player'; U.selPlayer = k; render(); },
  openMatches: k => { U.view = 'matches'; U.selPlayer = k; U.mFilter = 'all'; U.prevView = 'list'; render(); },
  ficheMatches: v => { const [k, f] = v.split(':'); U.prevView = U.view === 'player' ? 'player' : 'list'; U.view = 'matches'; U.selPlayer = k; U.mFilter = f; render(); },
  mFilter: v => { U.mFilter = v; render(); },
  backMatches: () => { U.view = U.prevView; if (U.prevView !== 'player') U.selPlayer = null; render(); },
  /* squad */
  addMember: () => { U.mEdit = '__new'; U.mName = U.mEmail = U.mHcp = U.mErr = ''; render(); },
  editMember: k => { const m = S.team.members[k] || {}; U.mEdit = k; U.mName = m.name || ''; U.mEmail = m.email || ''; U.mHcp = m.hcp || ''; U.mErr = ''; render(); },
  cancelMember: () => { U.mEdit = null; render(); },
  saveMember: () => {
    const name = (U.mName || '').trim(), hcp = (U.mHcp || '').trim().replace(',', '.');
    if (!name) { U.mErr = 'Indique le nom.'; return render(); }
    if (U.mEdit === '__new') {
      const email = (U.mEmail || '').trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { U.mErr = 'Adresse e-mail invalide.'; return render(); }
      const k = K(email);
      if ((S.team.memberKeys || []).includes(k)) { U.mErr = 'Ce joueur est déjà dans l’effectif.'; return render(); }
      U.mEdit = null; render();
      safe(() => updateDoc(doc(db, 'teams', S.teamId), { ['members.' + k]: { name, hcp, email }, memberKeys: arrayUnion(k) }), 'Joueur ajouté');
    } else {
      const k = U.mEdit; U.mEdit = null; render();
      safe(() => updateDoc(doc(db, 'teams', S.teamId), { ['members.' + k + '.name']: name, ['members.' + k + '.hcp']: hcp }), 'Enregistré');
    }
  },
  removeMember: () => { const k = U.mEdit; U.mEdit = null; render(); safe(() => updateDoc(doc(db, 'teams', S.teamId), { ['members.' + k]: deleteField(), memberKeys: arrayRemove(k) }), 'Joueur retiré'); },
  /* admin */
  createTeam: () => {
    const name = (U.tName || '').trim(); if (!name) return toast('Indique le nom de l’équipe.');
    const k = me(), season = (U.tSeason || '').trim();
    U.tName = U.tSeason = ''; render();
    safe(() => addDoc(collection(db, 'teams'), { name, season, captains: [], members: {}, memberKeys: [], createdAt: Date.now(), createdBy: k }), 'Équipe créée');
  },
  capTeam: v => { U.capTeam = v || null; U.cName = U.cEmail = U.cErr = ''; render(); },
  addCaptain: tid => {
    const email = (U.cEmail || '').trim().toLowerCase(), name = (U.cName || '').trim();
    if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { U.cErr = 'Nom et e-mail valides requis.'; return render(); }
    const k = K(email); const t = S.teams.find(x => x.id === tid); const exists = t.members && t.members[k];
    U.capTeam = null; render();
    const upd = { captains: arrayUnion(k), memberKeys: arrayUnion(k) };
    if (!exists) upd['members.' + k] = { name, hcp: '', email };
    safe(() => updateDoc(doc(db, 'teams', tid), upd), 'Capitaine ajouté');
  },
  removeCaptain: v => { const [tid, k] = v.split('|'); safe(() => updateDoc(doc(db, 'teams', tid), { captains: arrayRemove(k) }), 'Capitaine retiré'); },
  delTeam: v => { U.delTeam = v || null; render(); },
  doDelTeam: tid => { U.delTeam = null; render(); safe(() => deleteDoc(doc(db, 'teams', tid)), 'Équipe supprimée'); }
};

/* ---------- event wiring ---------- */
root.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || !root.contains(b)) return;
  const fn = A[b.dataset.a]; if (fn) { e.preventDefault(); fn(b.dataset.v); }
});
function setField(el) {
  const f = el.dataset.f; if (!f) return;
  if (f === 'teamPick') { S.teamId = el.value; U.view = 'list'; U.todayScroll = true; subscribeTeam(); render(); return; }
  if (f.startsWith('f.')) U.f[f.slice(2)] = el.value; else U[f] = el.value;
  if (el.dataset.r) render();
}
root.addEventListener('input', e => { if (e.target.tagName !== 'SELECT') setField(e.target); });
root.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.score !== undefined) {
    const k = el.dataset.score, v = el.value.trim();
    if (has(v) && (isNaN(Number(v)) || Number(v) < 0 || Number(v) > 60)) { toast('Score Stableford entre 0 et 60.'); return; }
    safe(() => updateDoc(evRef(U.sel), { ['scores.' + k]: has(v) ? v : deleteField() }));
    return;
  }
  if (el.tagName === 'SELECT') setField(el);
});
root.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('.auth') && e.target.tagName === 'INPUT') A.authGo(); });
render();
</script>
</body>
</html>
