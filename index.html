function genPwd() {
  const U_ = 'ABCDEFGHJKLMNPQRSTUVWXYZ', L_ = 'abcdefghijkmnpqrstuvwxyz', D_ = '23456789', X_ = '!?#*@%+';
  const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  const pick = set => set[rnd(set.length)];
  const chars = [pick(U_), pick(U_), pick(X_), pick(D_), pick(D_)];
  while (chars.length < 10) chars.push(pick(L_));
  for (let i = chars.length - 1; i > 0; i--) { const j = rnd(i + 1); [chars[i], chars[j]] = [chars[j], chars[i]]; }
  return chars.join('');
}

/* ---------- stats ---------- */
function computeStats() {
  const S2 = {};
  members().forEach(p => { S2[p.k] = { mpS: { w: 0, h: 0, l: 0 }, mpF: { w: 0, h: 0, l: 0 }, pts: 0, n: 0, stab18: [], stab9: [], yes: 0, conv: 0, hist: [], mp: [], put: { putts: 0, holes: 0, rounds: 0, udOk: 0, udTry: 0, sOk: 0, sTry: 0 } }; });
  const sorted = S.events.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  sorted.forEach(ev => {
    const memberKeys = (S.team && S.team.memberKeys) || [];
    Object.keys(S2).forEach(k => {
      const inv = ev.free ? (ev.invited || []).includes(k) : memberKeys.includes(k);
      if (inv) { S2[k].conv++; if (ev.r && ev.r[k] === 'yes') S2[k].yes++; }
    });
    if (isMPt(ev.type)) {
      const parties = ev.parties || (ev.sideA ? [{ a: ev.sideA, b: ev.sideB }] : []);
      parties.forEach(pt => {
        if (!pt.outcome) return;
        const four = pt.four !== undefined ? pt.four : ev.format === 'foursome';
        const inv = pt.outcome === 'win' ? 'loss' : pt.outcome === 'loss' ? 'win' : 'half';
        const sides = [{ ks: pt.a || [], res: pt.outcome, opp: names(pt.b) }, { ks: Array.isArray(pt.b) ? pt.b : [], res: inv, opp: names(pt.a) }];
        sides.forEach(sd => sd.ks.forEach(k => {
          const x = S2[k]; if (!x) return;
          const rec = four ? x.mpF : x.mpS;
          rec[sd.res === 'win' ? 'w' : sd.res === 'loss' ? 'l' : 'h']++;
          x.pts += sd.res === 'win' ? 1 : sd.res === 'half' ? 0.5 : 0; x.n++;
          const partner = sd.ks.filter(m => m !== k).map(nameOf).join(' & ');
          x.mp.push({ date: ev.date, title: ev.title, four, holes: ev.holes || 18, opp: sd.opp, partner, res: sd.res, margin: pt.margin || '' });
          x.hist.push({ date: ev.date, title: ev.title, tag: (four ? 'Foursome' : 'Simple') + ' · vs ' + sd.opp, label: sd.res === 'win' ? 'Victoire ' + (pt.margin || '') : sd.res === 'loss' ? 'Défaite ' + (pt.margin || '') : 'Partagé', cls: sd.res });
        }));
      });
    }
    if (isCourse(ev.type)) {
      const h = holesOf(ev);
      Object.entries(ev.scores || {}).forEach(([k, v]) => {
        if (!has(v) || isNaN(Number(v)) || !S2[k]) return;
        S2[k][h === 18 ? 'stab18' : 'stab9'].push(Number(v)); S2[k].n++;
        S2[k].hist.push({ date: ev.date, title: ev.title, tag: 'Stableford · ' + h + ' trous', label: v + ' pts', cls: '' });
      });
      Object.entries(ev.extra || {}).forEach(([k, e]) => {
        const P = S2[k] && S2[k].put; if (!P || !e) return;
        if (has(e.putts)) { P.putts += Number(e.putts); P.holes += h; P.rounds++; }
        P.udOk += Number(e.udOk || 0); P.udTry += Number(e.udTry || 0); P.sOk += Number(e.sOk || 0); P.sTry += Number(e.sTry || 0);
      });
    }
  });
  return S2;
}

// Périodes du thème automatique (mois-jour, bornes incluses)
const AUTO_THEMES = [['11-20', '12-06', 'stnicolas'], ['12-07', '12-27', 'noel'], ['12-28', '01-10', 'nouvelan'], ['01-11', '03-19', 'hiver'], ['03-20', '05-31', 'printemps']];
function activeTheme() {
  const t = S.team || {}; let k = t.theme || 'none';
  if (k === 'auto') {
    const d = new Date(), md = pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const hit = AUTO_THEMES.find(([a, b]) => a <= b ? (md >= a && md <= b) : (md >= a || md <= b));
    k = hit ? hit[2] : 'none';
  }
  return THEMES[k] && THEMES[k].bg ? k : 'none';
}
function themeMsg(k) {
  const t = S.team || {}, th = THEMES[k];
  const d = new Date(), an = d.getMonth() >= 6 ? d.getFullYear() + 1 : d.getFullYear(); // de juillet à décembre : l'année qui vient
  const raw = (t.themeMsgs && t.themeMsgs[k]) || th.msg;
  return raw.replace('{an}', an);
}
function vDeco() {
  const k = activeTheme(); if (k === 'none') return '';
  const th = THEMES[k];
  const spots = [[6, 18], [22, 62], [44, 10], [63, 58], [80, 20], [93, 66]];
  const bgm = spots.map(([x, y], i) => `<span style="position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-50%) scale(${i % 2 ? .6 : .8});opacity:.9">${SVG[th.bgIcon](th.bgColor)}</span>`).join('');

}
let fxKind = '';
function updateFx() {
  const k = S.user && S.team ? activeTheme() : 'none';
  const kind = k === 'none' ? '' : (THEMES[k].fx || '');
  if (kind === fxKind) return; fxKind = kind;
  let el = document.getElementById('fx'); if (el) el.remove();
  if (!kind) return;
  el = document.createElement('div'); el.id = 'fx'; el.setAttribute('aria-hidden', 'true');
  const n = 26, cols = ['#F5C542', '#E4572E', '#29A4D9', '#7BC950', '#B57BDB'];
  let h = '';
  for (let i = 0; i < n; i++) {
    const left = Math.round(Math.random() * 100), dur = (kind === 'snow' ? 9 : 7) + Math.random() * 7, delay = -Math.random() * 14, sz = 4 + Math.random() * 6;
    const dx = Math.round(Math.random() * 60 - 30) + 'px', rot = Math.round(Math.random() * 540) + 'deg';
    let st = `left:${left}%;animation-duration:${dur.toFixed(1)}s;animation-delay:${delay.toFixed(1)}s;--dx:${dx};--rot:${rot};`;
    if (kind === 'snow') st += `width:${sz}px;height:${sz}px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 2px rgba(80,120,170,.5)`;
    else if (kind === 'confetti') st += `width:${sz * .7}px;height:${sz * 1.4}px;background:${cols[i % cols.length]};border-radius:1px`;
    else if (kind === 'petal') st += `width:${sz + 2}px;height:${sz}px;border-radius:60% 40% 60% 40%;background:rgba(229,143,176,.75)`;
    else if (kind === 'star') st += `width:${sz}px;height:${sz}px;background:#F5C542;clip-path:polygon(50% 0,61% 38%,100% 38%,68% 60%,79% 100%,50% 76%,21% 100%,32% 60%,0 38%,39% 38%)`;
    h += `<i style="${st}"></i>`;
  }
  el.innerHTML = h; document.body.appendChild(el);
}

/* ---------- agenda ---------- */
function vAgenda() {
  const today = isoToday(), mk = me(), cap = capView();
  const nMembers = members().length;
  const evs = S.events.filter(e => {
    if (e.free && !cap && !(e.invited || []).includes(mk)) return false;
    if (U.agFilter !== 'all' && !FMAP[U.agFilter].includes(e.type)) return false;
    return true;
  }).sort((a, b) => ((a.date || '') + (a.time || '')).localeCompare((b.date || '') + (b.time || '')));
  const past = [], fut = [];
  evs.forEach(e => {
    const bucket = e.date < today ? past : fut;
    const d = dt(e.date), key = MOIS[d.getMonth()] + ' ' + d.getFullYear();
    let g = bucket[bucket.length - 1]; if (!g || g.month !== key) { g = { month: key, items: [] }; bucket.push(g); }
    g.items.push(e);
  });
  const item = e => {
    const d = dt(e.date); const r = e.r || {};
    const yes = Object.values(r).filter(v => v === 'yes').length;
    const mine = r[mk] || 'none';
    const full = isFull(e);
    const inOther = !cap && mine !== 'yes' && e.group && groupOf(e).some(x => x.id !== e.id && (x.r || {})[mk] === 'yes');
    const right = cap ? `<span class="pill ${full ? 'no' : ''}">${yes} / ${e.max || (e.free ? (e.invited || []).length : nMembers)}</span>`
      : (mine === 'yes' ? `<span class="pill yes">${ST.yes}</span>` : inOther ? `<span class="pill">Autre créneau</span>` : full ? `<span class="pill no">Complet</span>` : `<span class="pill ${mine}">${ST[mine]}</span>`);
    return `<button class="ev" data-a="open" data-v="${esc(e.id)}">
    <span class="tile" style="background:${typeOf(e.type).color}"><b>${d.getDate()}</b><span>${JOURS[d.getDay()]}</span></span>
    <span class="grow"><span class="t15 ell">${esc(e.title)}</span><span class="small ell">${e.free ? 'Partie libre · ' : ''}${esc(typeText(e))}${e.time ? ' · ' + esc(e.time) : ''}${e.max ? ' · max ' + e.max : ''}${e.group ? ' · créneau lié' : ''}</span></span>${right}</button>`;
  };
  const groups = gs => gs.map(g => `<div class="month">${g.month}</div>${g.items.map(item).join('')}`).join('');
  const now = new Date();
  return vHeader('Agenda', 'openAdd', cap ? 'Ajouter un événement' : 'Organiser une partie')
    + (vInstall() ? `<div style="padding:0 16px 6px">${vInstall()}</div>` : '')
    + `<div class="chips">${FILTERS.map(f => `<button class="chip ${U.agFilter === f.k ? 'on' : ''}" data-a="filter" data-v="${f.k}">${f.l}</button>`).join('')}</div>
    <div class="scroll" id="scroll" style="gap:8px">
    ${!evs.length ? `<div class="small center" style="padding:24px">Aucun événement${U.agFilter !== 'all' ? ' de ce type' : ''}.</div>` : ''}
    ${groups(past)}
    <div class="today" id="today-mark"><span>Aujourd’hui · ${JOURS_LONG[now.getDay()]} ${now.getDate()} ${MOIS[now.getMonth()].toLowerCase()}</span><i></i></div>
    ${fut.length ? groups(fut) : (evs.length ? '<div class="small" style="padding:8px 4px">Rien de prévu à venir.</div>' : '')}
    </div>`;
}

function vParticipation(ev, my) {

}
function vSlots(ev) {
  const g = groupOf(ev); if (g.length < 2) return '';
  return `<div class="card" style="gap:8px"><div class="t14" style="font-weight:800">Créneaux liés (un seul par joueur)</div>
  ${g.map(x => `<button class="ev" data-a="open" data-v="${esc(x.id)}" style="padding:8px 12px;${x.id === ev.id ? 'border-color:var(--g);background:var(--gl)' : ''}">
    <span class="grow"><span class="t14">${esc(slotLabel(x))}</span>${x.place ? `<span class="small">${esc(x.place)}</span>` : ''}</span>
    <span class="pill ${isFull(x) ? 'no' : ''}">${yesCount(x)}${x.max ? ' / ' + x.max : ''}${isFull(x) ? ' · complet' : ''}</span></button>`).join('')}</div>`;
}
function vDetail(ev) {
  const mk = me(), cap = capView(), t = typeOf(ev.type), r = ev.r || {};
  const pool = ev.free ? (ev.invited || []) : ((S.team.memberKeys) || []);
  const concerned = pool.includes(mk);
  const my = r[mk];
  let yes = 0, no = 0;
  const rows = pool.map(k => { const v = r[k] || 'none'; if (v === 'yes') yes++; if (v === 'no') no++; return { k, v, o: v === 'yes' ? 0 : v === 'none' ? 1 : 2 }; })
    .sort((a, b) => a.o - b.o || nameOf(a.k).localeCompare(nameOf(b.k), 'fr'));
  const canSet = cap && !ev.free;
  const canDelete = ev.free ? ev.org === mk : cap;
  let resSummary = '';
  if (isMPt(ev.type)) {
    const P = ev.parties || (ev.sideA ? [{ a: ev.sideA, b: ev.sideB }] : []);
    resSummary = P.length ? P.filter(p => p.outcome).length + ' / ' + P.length + ' parties saisies' : 'Aucune partie';
  } else if (isCourse(ev.type)) {
    const ys = pool.filter(k => r[k] === 'yes');
    resSummary = ys.length ? ys.filter(k => has((ev.scores || {})[k])).length + ' / ' + ys.length + ' scores saisis' : 'Aucun joueur confirmé';
  }
  return `<div class="top"><div><button class="back" data-a="backList">${ICON.back}Agenda</button></div></div>
  <div class="scroll" id="scroll" style="gap:18px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="badge" style="background:${t.color}">${esc(typeText(ev))}</span>
    <h2>${esc(ev.title)}</h2>
    <div class="sub" style="font-weight:500">${longDate(ev.date)}${ev.time ? ' · ' + esc(ev.time) : ''}</div>
    ${ev.place ? `<div class="sub" style="font-weight:500">${esc(ev.place)}</div>` : ''}
    ${ev.free ? `<div style="font-size:13px;font-weight:700;color:var(--or)">Partie libre · organisée par ${esc(nameOf(ev.org))}</div>` : ''}
    ${ev.notes ? `<div class="small">${esc(ev.notes)}</div>` : ''}
  </div>
  ${ev.free && ev.sideA ? `<div class="card vs"><div class="t14 center">${ev.sideA.map(k => esc(nameOf(k))).join('<br>')}</div><div class="small" style="font-weight:800">VS</div><div class="t14 center">${ev.sideB.map(k => esc(nameOf(k))).join('<br>')}</div></div>` : ''}
  ${concerned ? vParticipation(ev, my) : ''}
  ${ev.group ? vSlots(ev) : ''}
  ${isGolf(ev.type) ? `<button class="ev" data-a="openResults" style="padding:14px 16px;border-radius:18px">
    <span style="width:40px;height:40px;flex-shrink:0;border-radius:12px;background:var(--gl);color:var(--gd);display:flex;align-items:center;justify-content:center">${ICON.trophy}</span>
    <span class="grow"><span class="t15" style="font-weight:800">Résultats</span><span class="small">${esc(resSummary)}</span></span>${ICON.chev}</button>` : ''}
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="toprow"><div style="font-size:16px;font-weight:800">Réponses</div><div class="small">${yes}${ev.max ? ' / ' + ev.max : ''} présents · ${no} absents · ${pool.length - yes - no} sans réponse</div></div>
    ${canSet ? '<div class="small">Capitaine : touche le statut d’un joueur pour le changer (À répondre → Présent → Absent).</div>' : ''}
    <div class="list">${rows.map(x => `<div class="li"><div class="av">${esc(initials(nameOf(x.k)))}</div><div class="grow t14" style="font-weight:600">${esc(nameOf(x.k))}${x.k === mk ? ' (toi)' : ''}</div>
      ${canSet ? `<button class="pill ${x.v} click" data-a="cycle" data-v="${esc(x.k)}" aria-label="Changer la présence de ${esc(nameOf(x.k))}">${ST[x.v]}</button>` : `<span class="pill ${x.v}">${ST[x.v]}</span>`}</div>`).join('') || '<div class="li small">Aucun joueur.</div>'}</div>
  </div>
  ${canDelete ? (U.confirmDel ? `<div class="card" style="background:var(--redl);border-color:#E8C9C3"><div class="t14" style="color:var(--red)">Supprimer définitivement ?</div><div class="flex"><button class="btn" data-a="confirmDel" data-v="0">Annuler</button><button class="btn" style="background:var(--red);border-color:var(--red);color:#fff" data-a="doDelete">Supprimer</button></div></div>`
    : `<button class="btn danger" data-a="confirmDel" data-v="1">${ev.free ? 'Supprimer la partie' : 'Supprimer l’événement'}</button>`)
    : (ev.free && cap ? '<div class="small center">Seul l’organisateur peut supprimer cette partie.</div>' : '')}
  </div>`;
}

/* ---------- results ---------- */
function vResults(ev) {
  const mk = me(), cap = capView(), isIC = ev.type === 'interclub';
  let html = `<div class="top"><div><button class="back" data-a="backDetail">${ICON.back}Événement</button></div>
  <div style="display:flex;flex-direction:column;gap:4px"><h2>Résultats</h2><div class="t14">${esc(ev.title)}</div><div class="small">${esc(typeText(ev))} · ${longDate(ev.date)}</div></div></div>
  <div class="scroll" id="scroll" style="gap:14px">`;
  if (isMPt(ev.type)) {
    const P = ev.parties || (ev.sideA ? [{ a: ev.sideA, b: ev.sideB }] : []);
    const canRes = ev.free ? (ev.invited || []).includes(mk) : cap;
    let won = 0, lost = 0, any = false;
    const cards = P.map((pt, i) => {
      const aT = names(pt.a), bT = names(pt.b); let txt, cls;
      if (pt.outcome === 'win') { txt = aT + ' gagne · ' + pt.margin; cls = 'win'; won++; any = true; }
      else if (pt.outcome === 'loss') { txt = bT + ' gagne · ' + pt.margin; cls = 'loss'; lost++; any = true; }
      else if (pt.outcome === 'half') { txt = 'Partagé (AS)'; cls = ''; won += .5; lost += .5; any = true; }
      else { txt = 'Résultat à saisir'; cls = 'none'; }
      const four = pt.four !== undefined ? pt.four : ev.format === 'foursome';
      return `<div class="card" style="padding:12px 14px;gap:10px">
      ${isIC ? `<div style="display:flex;align-items:center;gap:8px"><span class="order">Départ n°${i + 1}</span><span class="small" style="flex:1;font-weight:700">${four ? 'Foursome' : 'Simple'}</span>
        ${cap ? `<button class="mini" data-a="move" data-v="${i}:-1" aria-label="Monter">${ICON.up}</button><button class="mini" data-a="move" data-v="${i}:1" aria-label="Descendre">${ICON.down}</button>` : ''}</div>` : ''}
      <div class="vs"><div class="t14" style="font-size:13px">${esc(aT)}</div><div class="small" style="font-weight:800">VS</div><div class="t14" style="font-size:13px;text-align:right">${esc(bT)}</div></div>
      <div class="toprow" style="flex-wrap:wrap"><span class="pill ${cls}" style="max-width:100%">${esc(txt)}</span>
      ${canRes ? `<span style="display:flex;gap:6px;margin-left:auto">${cap && !ev.free ? `<button class="edit" style="color:var(--red)" data-a="delParty" data-v="${i}" aria-label="Retirer cette partie">Retirer</button>` : ''}<button class="edit" data-a="editParty" data-v="${i}">${pt.outcome ? 'Modifier' : 'Saisir'}</button></span>` : ''}</div></div>`;
    }).join('');
    const ep = has(U.pEdit) && P[U.pEdit] ? P[U.pEdit] : null;
    html += `<div class="toprow"><div style="font-size:16px;font-weight:800">${isIC ? 'Ordre de départ' : 'Parties'}</div>
      <div style="font-size:13px;font-weight:800;color:var(--g)">${!ev.free && any ? (isIC ? 'Nous ' + half(won) + ' – ' + half(lost) + ' ' + esc(ev.club || '') : 'Équipe ' + half(won) + ' – ' + half(lost)) : ''}</div></div>
      ${cards || '<div class="small">Aucune partie encore.' + (cap && !ev.free ? ' Ajoute les départs ci-dessous.' : '') + '</div>'}`;
    if (ep && canRes) {
      const M = (ev.holes || 18) === 9 ? M9 : M18;
      html += `<div class="panel"><div class="t14" style="font-weight:800">Qui gagne ?</div>
      <button class="btn left ${U.pOut === 'win' ? 'sel' : ''}" data-a="pOut" data-v="win">${esc(names(ep.a))} gagne</button>
      <button class="btn left ${U.pOut === 'half' ? 'sel' : ''}" data-a="pOut" data-v="half">Partagé (all square)</button>
      <button class="btn left ${U.pOut === 'loss' ? 'sel' : ''}" data-a="pOut" data-v="loss">${esc(names(ep.b))} gagne</button>
      ${U.pOut !== 'half' ? `<label class="f">Écart<select class="in" data-f="pMargin">${M.map(m => `<option ${m === U.pMargin ? 'selected' : ''}>${m}</option>`).join('')}</select></label>` : ''}
      <div class="flex"><button class="btn" data-a="cancelParty">Annuler</button><button class="btn primary" data-a="saveResult">Valider</button></div></div>`;
    }
    if (cap && !ev.free && !ep) {
      if (!U.addParty) html += `<button class="btn dashed" data-a="openAddParty">${isIC ? '+ Ajouter un départ' : '+ Ajouter une partie'}</button>`;
      else {
        const pres = members().filter(p => (ev.r || {})[p.k] === 'yes');
        const poolP = pres.length ? pres : members();
        const four = isIC ? !!U.npFour : ev.format === 'foursome';
        const opts = sel => `<option value="">Choisir…</option>` + poolP.map(p => `<option value="${esc(p.k)}" ${p.k === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
        html += `<div class="panel"><div class="t14" style="font-weight:800">${isIC ? 'Départ n°' + (P.length + 1) : four ? 'Nouveau foursome' : 'Nouveau simple'}</div>
        ${isIC ? `<div class="row2"><button class="btn ${!four ? 'sel' : ''}" data-a="npFour" data-v="0">Simple</button><button class="btn ${four ? 'sel' : ''}" data-a="npFour" data-v="1">Foursome</button></div>` : ''}
        <label class="f">Notre joueur<select class="in" data-f="npA1">${opts(U.npA1)}</select></label>
        ${four ? `<label class="f">Son partenaire<select class="in" data-f="npA2">${opts(U.npA2)}</select></label>` : ''}
        <label class="f">${isIC ? 'Adversaire (facultatif)' : 'Adversaire(s)'}<input class="in" data-f="npB" value="${esc(U.npB)}" placeholder="Nom de l’adversaire"></label>
        ${U.partyErr ? `<div class="err">${esc(U.partyErr)}</div>` : ''}
        <div class="flex"><button class="btn" data-a="closeAddParty">Annuler</button><button class="btn primary" data-a="saveParty">Ajouter</button></div></div>`;
      }
    }
  }
  if (isCourse(ev.type)) {
    const pool = ev.free ? (ev.invited || []) : (S.team.memberKeys || []);
    const ys = pool.filter(k => (ev.r || {})[k] === 'yes');
    const sc = ev.scores || {}, ex = ev.extra || {};
    const vals = ys.map(k => sc[k]).filter(has).map(Number);
    html += `<div class="toprow"><div style="font-size:16px;font-weight:800">Classement</div><div class="small" style="font-weight:700">Stableford · points</div></div>
    <div class="list">${ys.map(k => {
      const v = sc[k], hv = has(v); const pos = hv ? 1 + vals.filter(x => x > Number(v)).length : '';
      const editable = cap || k === mk; const e = ex[k];
      const exText = e ? `Putts ${e.putts || '—'} · App. ${e.udOk || 0}/${e.udTry || 0} · Sandy ${e.sOk || 0}/${e.sTry || 0}` : (editable ? '+ putts, approche-put, sandy' : '');
      return `<div class="li" style="padding:8px 14px"><div class="pos ${pos === 1 ? 'first' : ''}">${pos}</div>
      ${editable ? `<button class="grow" style="border:none;background:none;text-align:left;padding:4px 0" data-a="openExtra" data-v="${esc(k)}"><span class="t14" style="font-weight:600">${esc(nameOf(k))}</span><span style="font-size:11px;font-weight:600;color:var(--g)">${esc(exText)}</span></button>
        <input class="in num" type="number" inputmode="numeric" min="0" max="60" data-score="${esc(k)}" value="${hv ? esc(v) : ''}" aria-label="Points Stableford de ${esc(nameOf(k))}">`
        : `<div class="grow"><span class="t14" style="font-weight:600">${esc(nameOf(k))}</span><span class="small" style="font-size:11px">${esc(exText)}</span></div><div class="t15" style="width:72px;text-align:center">${hv ? esc(v) : '—'}</div>`}
      <div class="small" style="width:24px">pts</div></div>`;
    }).join('') || '<div class="li small">Aucun joueur n’a confirmé sa participation.</div>'}</div>`;
    if (U.xEdit && ys.includes(U.xEdit)) {
      const num = (l, f) => `<label class="f" style="font-size:12px">${l}<input class="in" type="number" inputmode="numeric" min="0" data-f="${f}" value="${esc(U[f])}" style="text-align:center;font-weight:700"></label>`;
      html += `<div class="panel"><div class="t14" style="font-weight:800">Petit jeu · ${esc(nameOf(U.xEdit))}</div>
      ${num('Nombre de putts (total)', 'xPutts')}
      <div class="small">Approche-put : approche + 1 putt pour sauver le par (ou mieux). Sandy : sortie de bunker + 1 putt.</div>
      <div class="row2">${num('Approche-put réussis', 'xUdOk')}${num('Approche-put tentés', 'xUdTry')}${num('Sandy réussis', 'xSOk')}${num('Sandy tentés', 'xSTry')}</div>
      ${U.xErr ? `<div class="err">${esc(U.xErr)}</div>` : ''}
      <div class="flex"><button class="btn" data-a="cancelExtra">Annuler</button><button class="btn primary" data-a="saveExtra">Valider</button></div></div>`;
    }
    html += `<div class="small">${cap ? 'Le capitaine peut saisir tous les scores ; chaque joueur saisit le sien.' : 'Tu saisis ton score ; le classement se met à jour.'} Le score est enregistré dès que tu quittes la case.</div>`;
  }
  return html + '</div>';
}

/* ---------- stats ---------- */
function vStats() {
  const St = computeStats(), M = members();
  const rec = r => r.w + '-' + r.h + '-' + r.l;
  const row = (r, act, v) => `<button class="li" data-a="${act}" data-v="${esc(r.k)}"><span class="pos ${r.pos === 1 ? 'first' : ''}">${r.pos}</span><span class="grow"><span class="t14">${esc(r.name)}</span><span class="small">${esc(r.sub)}</span></span><span class="t15" style="font-weight:800">${esc(r.value)}</span></button>`;
  let html = vHeader('Statistiques') + `<div class="scroll" id="scroll"><div class="tabs" style="grid-template-columns:repeat(4,1fr)">
  ${[['mp', 'Match play'], ['score', 'Stableford'], ['put', 'Putting'], ['pres', 'Présences']].map(([k, l]) => `<button class="tab ${U.statTab === k ? 'on' : ''}" data-a="statTab" data-v="${k}" style="font-size:11px">${l}</button>`).join('')}</div>`;
  if (U.statTab === 'mp') {
    const rows = rankRows(M.filter(p => St[p.k].mp.length).map(p => { const x = St[p.k]; return { k: p.k, name: p.name, pts: x.pts, sub: 'Simple ' + rec(x.mpS) + ' · Foursome ' + rec(x.mpF), value: fmtPts(x.pts) }; }), (a, b) => b.pts - a.pts);
    html += `<div class="small">Simple et foursome · victoire 1 pt, partagé ½ · V-N-D = victoires, nuls, défaites. Touche un joueur pour voir ses matchs.</div><div class="list">${rows.map(r => row(r, 'openMatches')).join('') || '<div class="li small">Aucun match play saisi.</div>'}</div>`;
  } else if (U.statTab === 'score') {
    [['stab18', 'Stableford 18 trous'], ['stab9', 'Stableford 9 trous']].forEach(([k, t]) => {
      const rows = rankRows(M.filter(p => St[p.k][k].length).map(p => { const a = St[p.k][k], m = avg(a); return { k: p.k, name: p.name, m, sub: a.length + (a.length > 1 ? ' parties' : ' partie') + ' · meilleur ' + Math.max(...a), value: fmtN(m) }; }), (a, b) => b.m - a.m);
      if (rows.length) html += `<div class="toprow" style="padding:0 4px"><div class="t14" style="font-weight:800">${t}</div><div class="small">moyenne en points</div></div><div class="list">${rows.map(r => row(r, 'openPlayer')).join('')}</div>`;
    });
    if (!M.some(p => St[p.k].stab18.length || St[p.k].stab9.length)) html += '<div class="small center" style="padding:20px">Aucun score Stableford saisi.</div>';
  } else if (U.statTab === 'put') {
    const rows = rankRows(M.filter(p => { const P = St[p.k].put; return P.holes || P.udTry || P.sTry; }).map(p => {
      const P = St[p.k].put, ppt = P.holes ? P.putts / P.holes : 99;
      return { k: p.k, name: p.name, ppt, sub: 'App.-put ' + P.udOk + '/' + P.udTry + ' (' + pct(P.udOk, P.udTry) + ') · Sandy ' + P.sOk + '/' + P.sTry + ' (' + pct(P.sOk, P.sTry) + ')', value: P.holes ? ppt.toFixed(2).replace('.', ',') + '/t' : '—' };
    }), (a, b) => a.ppt - b.ppt);
    html += `<div class="small">Classés par putts par trou (9 et 18 trous comparables) · approche-put et sandy en % de réussite</div><div class="list">${rows.map(r => row(r, 'openPlayer')).join('') || '<div class="li small">Aucune donnée de putting.</div>'}</div>`;
  } else {
    const rows = rankRows(M.map(p => { const x = St[p.k], pc = x.conv ? Math.round(100 * x.yes / x.conv) : 0; return { k: p.k, name: p.name, pc, sub: x.yes + ' / ' + x.conv + ' événements', value: pc + ' %' }; }), (a, b) => b.pc - a.pc);
    html += `<div class="small">Présences confirmées sur les événements où le joueur est convoqué ou invité</div><div class="list">${rows.map(r => row(r, 'openPlayer')).join('')}</div>`;
  }
  return html + '</div>';
}
function vFiche(k, withBack) {
  const St = computeStats(), X = St[k];
  const p = members().find(m => m.k === k);
  if (!X) return vHeader('Mes stats') + `<div class="scroll" id="scroll"><div class="small">Tu ne fais pas partie de l’effectif de cette équipe.</div></div>`;
  const rec = r => r.w + '-' + r.h + '-' + r.l, PP = X.put;
  const tiles = [
    { l: 'Match play simple', v: rec(X.mpS), s: 'V-N-D · voir les matchs', a: 'single' },
    { l: 'Foursome', v: rec(X.mpF), s: 'V-N-D · voir les matchs', a: 'foursome' },
    { l: 'Points match play', v: fmtPts(X.pts), s: 'victoire 1 · partagé ½' },
    { l: 'Présences', v: (X.conv ? Math.round(100 * X.yes / X.conv) : 0) + ' %', s: X.yes + ' / ' + X.conv + ' événements' },
    { l: 'Stableford 18 trous', v: X.stab18.length ? fmtN(avg(X.stab18)) : '—', s: X.stab18.length ? 'moyenne · ' + X.stab18.length + ' partie(s)' : 'aucun score' }
  ];
  if (X.stab9.length) tiles.push({ l: 'Stableford 9 trous', v: fmtN(avg(X.stab9)), s: 'moyenne · ' + X.stab9.length + ' partie(s)' });
  tiles.push({ l: 'Putts par trou', v: PP.holes ? (PP.putts / PP.holes).toFixed(2).replace('.', ',') : '—', s: PP.rounds ? 'sur ' + PP.rounds + ' parcours' : 'aucune donnée' });
  tiles.push({ l: 'Approche-put', v: pct(PP.udOk, PP.udTry), s: PP.udOk + ' / ' + PP.udTry + ' réussis' });
  tiles.push({ l: 'Sandy', v: pct(PP.sOk, PP.sTry), s: PP.sOk + ' / ' + PP.sTry + ' réussis' });
  const name = p ? p.name : nameOf(k);
  const top = withBack ? `<div class="top"><div><button class="back" data-a="backList">${ICON.back}Statistiques</button></div></div>` : vHeader('Mes stats');

  <div class="card" style="flex-direction:row;align-items:center;gap:14px"><div class="av" style="width:52px;height:52px;border-radius:26px;background:var(--gl);color:var(--gd);font-size:17px;font-weight:800">${esc(initials(name))}</div>
  <div><div style="font-size:19px;font-weight:800">${esc(name)}</div><div class="small">HCP ${esc(p && p.hcp ? p.hcp : '—')} · ${X.n} résultats</div></div></div>
  <div class="grid2">${tiles.map(t => t.a ? `<button class="stat" data-a="ficheMatches" data-v="${esc(k)}:${t.a}"><span class="l">${t.l} ›</span><span class="v">${esc(t.v)}</span><span class="small" style="font-size:11px">${esc(t.s)}</span></button>`
    : `<div class="stat"><div class="l">${t.l}</div><div class="v">${esc(t.v)}</div><div class="small" style="font-size:11px">${esc(t.s)}</div></div>`).join('')}</div>
  <div style="font-size:16px;font-weight:800;padding:4px 4px 0">Historique</div>
  <div class="list">${X.hist.slice().reverse().map(h => `<div class="li"><div class="small" style="width:46px;flex-shrink:0;font-weight:700">${shortDate(h.date)}</div><div class="grow"><span class="t14 ell" style="font-size:13px">${esc(h.title)}</span><span class="small" style="font-size:11px">${esc(h.tag)}</span></div><span class="pill ${h.cls}">${esc(h.label)}</span></div>`).join('') || '<div class="li small">Aucun résultat pour l’instant.</div>'}</div>
  </div>`;
}
function vMatches(k) {

  <div class="scroll" id="scroll"><div class="list">${list.map(m => `<div class="li" style="padding:12px 14px"><div class="small" style="width:46px;flex-shrink:0;font-weight:700">${shortDate(m.date)}</div>

/* ---------- actions ---------- */
function resetForm() {
  U.f = { max: '', slots: [], type: capView() ? 'interclub' : 'matchplay', format: 'single', holes: 18, home: true, club: '', title: '', date: '', time: '', place: '', notes: '', opp1: '', opp2: '', partner: '', guests: [] };
  U.fErr = '';
}
const A = {
  authMode: v => { U.authMode = v; U.aErr = U.aOk = ''; render(); },
  authGo: async () => {
    U.aErr = U.aOk = '';
    const email = (U.aEmail || '').trim(), pwd = U.aPwd || '';
    try {
      if (U.authMode === 'reset') { if (!email) throw { code: 'x', message: 'Indique ton e-mail.' }; await sendPasswordResetEmail(auth, email); U.aOk = 'Lien envoyé. Regarde ta boîte mail.'; }
      else if (U.authMode === 'signup') {
        if (!(U.aName || '').trim()) throw { code: 'x', message: 'Indique ton prénom et ton nom.' };
        if (!okPhone(U.aPhone)) throw { code: 'x', message: 'N° de GSM invalide.' };
        if (!PWD_RE.test(pwd)) throw { code: 'x', message: 'Mot de passe : ' + PWD_RULE };
        const c = await createUserWithEmailAndPassword(auth, email, pwd);
        await updateProfile(c.user, { displayName: U.aName.trim() });
        try { await sendRequest(); } catch (e) { console.error(e); }

root.addEventListener('click', e => {
  const mkEl = e.target.closest('[data-mark]');
  if (mkEl && db) { const [k, tid] = mkEl.dataset.mark.split('|'); if (k) setContact(k, { sentAt: Date.now() }, tid || undefined).catch(err => console.error(err)); }
  const b = e.target.closest('[data-a]'); if (!b || !root.contains(b)) return;
  const fn = A[b.dataset.a]; if (fn) { e.preventDefault(); fn(b.dataset.v); }
});
function setField(el) {
  const f = el.dataset.f; if (!f) return;
  if (f === 'teamPick') { U.titleEdit = false; S.teamId = el.value; U.view = 'list'; U.todayScroll = true; subscribeTeam(); render(); return; }
  if (f === 'tiTheme') { U.tiTheme = el.value; U.tiMsg = ((S.team && S.team.themeMsgs) || {})[el.value] || ''; render(); return; }
  if (f.startsWith('slot.')) { const [, i, key] = f.split('.'); U.f.slots[Number(i)][key] = el.value; }
  else if (f.startsWith('f.')) U.f[f.slice(2)] = el.value; else U[f] = el.value;
  if (el.dataset.r) render();
}
root.addEventListener('input', e => { if (e.target.tagName !== 'SELECT') setField(e.target); });
root.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.score !== undefined) {
    const k = el.dataset.score, v = el.value.trim();
    if (has(v) && (isNaN(Number(v)) || Number(v) < 0 || Number(v) > 60)) { toast('Score Stableford entre 0 et 60.'); return; }
    safe(() => updateDoc(evRef(U.sel), { ['scores.' + k]: has(v) ? v : deleteField() }));
    return;
  }
  if (el.tagName === 'SELECT') setField(el);
});
root.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('.auth') && e.target.tagName === 'INPUT') A.authGo(); });
render();
</script>
</body>
</html>
